name: Masoud Ultimate Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos, SDK & Ldid (Manual)
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Create Bypass Project
        run: |
          mkdir -p bypass_project
          cd bypass_project
          
          curl -sO https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h
          curl -sO https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c
          
          cat << 'EOF' > control
          Package: com.masoud.ultimate.bypass
          Name: ShadowBypass
          Version: 1.0.0
          Architecture: iphoneos-arm
          Maintainer: Masoud
          Author: Masoud
          Section: Tweaks
          EOF

          cat << 'EOF' > Makefile
          ARCHS = arm64
          TARGET = iphone:clang:latest:14.0
          SYSROOT = $(THEOS)/sdks/iPhoneOS14.5.sdk
          
          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = ShadowBypass
          ShadowBypass_FILES = Tweak.xm fishhook.c
          ShadowBypass_CFLAGS = -fobjc-arc

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF
          
          cat << 'EOF' > ShadowBypass.plist
          { Filter = { Bundles = ( "com.tencent.ig" ); }; }
          EOF

          # كود الـ Tweak.xm مضاف إليه خاصية "مسح الأثر"
          cat << 'EOF' > Tweak.xm
          #import <Foundation/Foundation.h>
          #import <mach-o/dyld.h>
          #import <sys/mman.h>
          #import <string.h>
          #import <dlfcn.h>
          #import "fishhook.h"

          // ==========================================
          // 🧹 دالة مسح الأثر (Anti-Forensics / Log Wiper)
          // ==========================================
          void clear_game_logs() {
              NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
              NSString *documentsDirectory = [paths firstObject];
              
              // مسارات ملفات السجل الخاصة باللعبة
              NSArray *logPaths = @[
                  [documentsDirectory stringByAppendingPathComponent:@"ShadowTrackerExtra/Saved/Logs"],
                  [documentsDirectory stringByAppendingPathComponent:@"logs"],
                  [documentsDirectory stringByAppendingPathComponent:@"TGPA/logs"],
                  [documentsDirectory stringByAppendingPathComponent:@"ProgramLogs"]
              ];
              
              NSFileManager *fileManager = [NSFileManager defaultManager];
              for (NSString *path in logPaths) {
                  if ([fileManager fileExistsAtPath:path]) {
                      [fileManager removeItemAtPath:path error:nil];
                  }
              }
              NSLog(@"[+] Masoud: All Game Trace Logs Wiped Successfully!");
          }

          // ==========================================
          // 🛠️ دالة التعديل على الذاكرة
          // ==========================================
          void apply_memory_patch(uint64_t ida_offset) {
              intptr_t slide = _dyld_get_image_vmaddr_slide(0);
              uintptr_t target_addr = slide + 0x100000000 + ida_offset;
              
              size_t page_size = sysconf(_SC_PAGESIZE);
              uintptr_t page_start = target_addr & ~(page_size - 1);
              mprotect((void*)page_start, page_size, PROT_READ | PROT_WRITE | PROT_EXEC);
              
              unsigned char nop_bytes[] = {0x1F, 0x20, 0x03, 0xD5};
              memcpy((void*)target_addr, nop_bytes, 4);
          }

          static void* (*original_dlsym)(void* handle, const char* symbol);
          static char* (*original_strstr)(const char *haystack, const char *needle);
          
          const char* fake_dyld_get_image_name(uint32_t image_index) {
              const char *real_name = _dyld_get_image_name(image_index); 
              if (real_name && (strstr(real_name, "ShadowBypass") || strstr(real_name, "MobileSubstrate") || strstr(real_name, "Cydia"))) {
                  return "/usr/lib/system/libdyld.dylib";
              }
              return real_name;
          }

          const struct mach_header* fake_dyld_get_image_header(uint32_t image_index) {
              const char *real_name = _dyld_get_image_name(image_index);
              if (real_name && (strstr(real_name, "ShadowBypass") || strstr(real_name, "MobileSubstrate") || strstr(real_name, "Cydia"))) {
                  return _dyld_get_image_header(0); 
              }
              return _dyld_get_image_header(image_index);
          }
          
          char* fake_strstr(const char *haystack, const char *needle) {
              if (haystack == NULL || needle == NULL) return NULL;

              if (strcmp(needle, "frida") == 0 || strcmp(needle, "Cydia") == 0 || strcmp(needle, "Substrate") == 0) {
                  return NULL;
              }
              
              if (original_strstr != NULL) {
                  return original_strstr(haystack, needle);
              }
              return (char *)strstr(haystack, needle);
          }
          
          void* hooked_dlsym(void* handle, const char* symbol) {
              if (symbol) {
                  if (strcmp(symbol, "_dyld_get_image_name") == 0) return (void*)fake_dyld_get_image_name;
                  if (strcmp(symbol, "_dyld_get_image_header") == 0) return (void*)fake_dyld_get_image_header;
                  if (strcmp(symbol, "strstr") == 0) return (void*)fake_strstr;
              }
              
              if (original_dlsym != NULL) {
                  return original_dlsym(handle, symbol);
              }
              return NULL;
          }

          __attribute__((constructor)) static void setup_all_bypass() {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 40 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  
                  // 1. مسح آثار اللوجات فوراً
                  clear_game_logs();
                  
                  // 2. تطبيق الحماية (NOPs)
                  apply_memory_patch(0x68F2720); 
                  apply_memory_patch(0x68F0BC0); 
                  apply_memory_patch(0x68F2BB8); 
                  
                  // 3. تفعيل الهوكين
                  struct rebinding rebindings[] = {
                      {"dlsym", (void *)hooked_dlsym, (void **)&original_dlsym},
                      {"strstr", (void *)fake_strstr, (void **)&original_strstr}
                  };
                  rebind_symbols(rebindings, 2);
                  
                  NSLog(@"[+] Masoud Ultimate Bypass Injected & Logs Wiped Successfully!");
              });
          }
          EOF

      - name: Compile Dylib
        run: |
          cd bypass_project
          make FINALPACKAGE=1

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masoud-Ultimate-Dylib
          path: bypass_project/.theos/obj/*.dylib
          
