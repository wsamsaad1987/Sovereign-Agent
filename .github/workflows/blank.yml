name: Falcon Eye - Ultimate UI & Network Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_ui_engine:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Falcon UI Source
        run: |
          cat <<'EOF' > FalconEye.mm
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <mach-o/dyld.h>
          #import <mach/mach.h>
          #include <vector>
          #include <map>

          /* --- إعلانات الدوال الأساسية --- */
          void FetchDataFromServer(void);
          void SaveLicenseKey(NSString* key);
          NSString* GetSavedLicenseKey(void);
          void ShowDebugAlert(NSString *title, NSString *message);
          void RestoreAllOffsets(void);

          // 🌐 الأيبي الخاص بسيرفرك (الرابط الأساسي)
          NSString *apiUrlBase = @"http://34.204.178.160/api.php";

          /* 🚨 دالة التنبيهات المحدثة 🚨 */
          void ShowDebugAlert(NSString *title, NSString *message) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:title message:message preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"عاش الصقر" style:UIAlertActionStyleDefault handler:nil]];
                  
                  // طريقة حديثة لجلب الـ Root ViewController بدون استخدام keyWindow الملغى
                  UIWindow *window = nil;
                  if (@available(iOS 13.0, *)) {
                      for (UIWindowScene* windowScene in [UIApplication sharedApplication].connectedScenes) {
                          if (windowScene.activationState == UISceneActivationStateForegroundActive) {
                              window = windowScene.windows.firstObject;
                              break;
                          }
                      }
                  } else {
                      window = [UIApplication sharedApplication].keyWindow;
                  }
                  
                  if (window.rootViewController) {
                      [window.rootViewController presentViewController:alert animated:YES completion:nil];
                  }
              });
          }

          /* ==========================================
             🧠 نظام النسخ الاحتياطي وإدارة الذاكرة (Memory Manager)
             ========================================== */
          std::map<uintptr_t, std::vector<uint8_t>> originalBytesMap;

          void Patch(uintptr_t addr, std::vector<uint8_t> data) {
              mach_port_t t = mach_task_self();

              if (originalBytesMap.find(addr) == originalBytesMap.end()) {
                  std::vector<uint8_t> backup(data.size());
                  vm_size_t read_size = 0;
                  vm_read_overwrite(t, addr, data.size(), (vm_address_t)backup.data(), &read_size);
                  originalBytesMap[addr] = backup;
              }

              vm_protect(t, addr, data.size(), FALSE, VM_PROT_READ | VM_PROT_WRITE | VM_PROT_COPY);
              vm_write(t, addr, (vm_offset_t)data.data(), (mach_msg_type_number_t)data.size());
              vm_protect(t, addr, data.size(), FALSE, VM_PROT_READ | VM_PROT_EXECUTE);
          }

          void RestoreAllOffsets() {
              mach_port_t t = mach_task_self();
              for (auto const& [addr, origData] : originalBytesMap) {
                  vm_protect(t, addr, origData.size(), FALSE, VM_PROT_READ | VM_PROT_WRITE | VM_PROT_COPY);
                  vm_write(t, addr, (vm_offset_t)origData.data(), (mach_msg_type_number_t)origData.size());
                  vm_protect(t, addr, origData.size(), FALSE, VM_PROT_READ | VM_PROT_EXECUTE);
              }
              originalBytesMap.clear();
          }

          /* ==========================================
             🦅 شريط الحالة العلوي (Falcon HUD) 
             ========================================== */
          @interface FalconHUD : NSObject
          @property (nonatomic, strong) UIWindow *hudWindow;
          + (instancetype)sharedInstance;
          - (void)showHUD;
          @end

          @implementation FalconHUD
          + (instancetype)sharedInstance {
              static FalconHUD *shared = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{ shared = [[FalconHUD alloc] init]; });
              return shared;
          }

          - (void)showHUD {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (self.hudWindow) return;
                  
                  self.hudWindow = [[UIWindow alloc] initWithFrame:CGRectMake(0, 45, [UIScreen mainScreen].bounds.size.width, 40)];
                  self.hudWindow.windowLevel = UIWindowLevelAlert + 5000;
                  self.hudWindow.backgroundColor = [UIColor clearColor]; 
                  self.hudWindow.userInteractionEnabled = NO; 
                  
                  UIStackView *stack = [[UIStackView alloc] initWithFrame:self.hudWindow.bounds];
                  stack.axis = UILayoutConstraintAxisHorizontal;
                  stack.alignment = UIStackViewAlignmentCenter;
                  stack.distribution = UIStackViewDistributionEqualCentering;
                  
                  UILabel *safeLabel = [[UILabel alloc] init];
                  safeLabel.text = @"الحالة امن";
                  safeLabel.textColor = [UIColor systemYellowColor];
                  safeLabel.font = [UIFont boldSystemFontOfSize:13];
                  
                  UIView *ledContainer = [[UIView alloc] init];
                  UIView *led = [[UIView alloc] initWithFrame:CGRectMake(0, 4, 10, 10)];
                  led.backgroundColor = [UIColor colorWithRed:0.2 green:0.9 blue:0.2 alpha:1.0];
                  led.layer.cornerRadius = 5;
                  led.layer.shadowColor = [UIColor greenColor].CGColor;
                  led.layer.shadowOffset = CGSizeZero;
                  led.layer.shadowOpacity = 1.0;
                  led.layer.shadowRadius = 6.0;
                  
                  CABasicAnimation *pulse = [CABasicAnimation animationWithKeyPath:@"transform.scale"];
                  pulse.duration = 0.8;
                  pulse.toValue = @1.4;
                  pulse.autoreverses = YES;
                  pulse.repeatCount = HUGE_VALF;
                  [led.layer addAnimation:pulse forKey:@"pulse"];
                  
                  UILabel *connLabel = [[UILabel alloc] initWithFrame:CGRectMake(18, 0, 40, 18)];
                  connLabel.text = @"متصل";
                  connLabel.textColor = [UIColor whiteColor];
                  connLabel.font = [UIFont boldSystemFontOfSize:13];
                  
                  [ledContainer addSubview:led];
                  [ledContainer addSubview:connLabel];
                  [ledContainer.widthAnchor constraintEqualToConstant:60].active = YES;
                  [ledContainer.heightAnchor constraintEqualToConstant:18].active = YES;
                  
                  UILabel *vpsLabel = [[UILabel alloc] init];
                  vpsLabel.text = @"VPS يحسن الجودة";
                  vpsLabel.textColor = [UIColor colorWithRed:0.2 green:0.9 blue:0.2 alpha:1.0];
                  vpsLabel.font = [UIFont boldSystemFontOfSize:13];
                  
                  UIView *spacer1 = [[UIView alloc] init];
                  UIView *spacer2 = [[UIView alloc] init];
                  [spacer1.widthAnchor constraintEqualToConstant:20].active = YES;
                  [spacer2.widthAnchor constraintEqualToConstant:20].active = YES;
                  
                  [stack addArrangedSubview:spacer1];
                  [stack addArrangedSubview:safeLabel];
                  [stack addArrangedSubview:ledContainer];
                  [stack addArrangedSubview:vpsLabel];
                  [stack addArrangedSubview:spacer2];
                  
                  [self.hudWindow addSubview:stack];
                  [self.hudWindow makeKeyAndVisible];
              });
          }
          @end

          /* ==========================================
             🔐 شاشة تسجيل الدخول (Login UI)
             ========================================== */
          @interface FalconUI : NSObject <WKScriptMessageHandler>
          @property (nonatomic, strong) UIWindow *window;
          @property (nonatomic, strong) WKWebView *webView;
          + (instancetype)sharedInstance;
          - (void)show;
          - (void)hide;
          @end

          @implementation FalconUI
          + (instancetype)sharedInstance {
              static FalconUI *shared = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{ shared = [[FalconUI alloc] init]; });
              return shared;
          }

          - (void)show {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (self.window) return; 
                  
                  self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                  self.window.windowLevel = UIWindowLevelAlert + 10000;
                  self.window.backgroundColor = [UIColor clearColor];
                  
                  WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
                  [config.userContentController addScriptMessageHandler:self name:@"falconAuth"]; 
                  
                  self.webView = [[WKWebView alloc] initWithFrame:self.window.bounds configuration:config];
                  self.webView.backgroundColor = [UIColor clearColor];
                  self.webView.opaque = NO;
                  
                  NSString *html = @"<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'><script src='https://cdn.tailwindcss.com'></script><style>body { background: transparent; height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; font-family: sans-serif; }.glass { background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 35px; width: 360px; padding: 45px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.7); }.input { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 18px; width: 100%; color: white; text-align: center; outline: none; transition: 0.3s; font-weight: bold; }</style></head><body><div class='glass'><h1 class='text-5xl font-black text-white mb-2 italic tracking-tighter'>FALCON <span class='text-blue-500'>EYE</span></h1><p class='text-gray-400 text-[9px] mb-10 uppercase tracking-widest opacity-60 font-bold'>Dynamic Security System</p><input type='text' id='k' placeholder='أدخل مفتاح التفعيل' class='input mb-6'><button onclick='activate()' id='btn' class='w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl shadow-xl active:scale-95 transition-all text-xl'>تفعيل الأداة</button><div id='msg' class='mt-6 text-sm font-bold hidden'></div></div><script>function activate(){ var code = document.getElementById('k').value; if(!code) return; document.getElementById('btn').style.opacity='0.5'; document.getElementById('btn').disabled=true; document.getElementById('msg').innerHTML='جاري التحقق من السيرفر...'; document.getElementById('msg').className='mt-6 text-blue-400 text-sm font-bold animate-pulse'; document.getElementById('msg').classList.remove('hidden'); window.webkit.messageHandlers.falconAuth.postMessage(code); } function showResult(isSuccess, message){ document.getElementById('btn').style.opacity='1'; document.getElementById('btn').disabled=false; document.getElementById('msg').innerHTML=message; document.getElementById('msg').className = isSuccess ? 'mt-6 text-green-400 text-sm font-bold' : 'mt-6 text-red-500 text-sm font-bold'; }</script></body></html>";
                  
                  [self.webView loadHTMLString:html baseURL:nil];
                  [self.window addSubview:self.webView];
                  [self.window makeKeyAndVisible];
              });
          }

          - (void)hide {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (self.window) {
                      self.window.hidden = YES;
                      self.window = nil;
                  }
              });
          }

          - (void)userContentController:(WKUserContentController *)userContentController didReceiveScriptMessage:(WKScriptMessage *)message {
              if ([message.name isEqualToString:@"falconAuth"]) {
                  NSString *code = (NSString *)message.body;
                  NSString *udid = [[UIDevice currentDevice] identifierForVendor].UUIDString;
                  
                  NSString *authUrlStr = [NSString stringWithFormat:@"%@?action=auth&code=%@&udid=%@", apiUrlBase, code, udid];
                  
                  [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:authUrlStr] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                      dispatch_async(dispatch_get_main_queue(), ^{
                          if (e || !d) {
                              [self.webView evaluateJavaScript:@"showResult(false, '❌ خطأ في الاتصال بالسيرفر');" completionHandler:nil];
                              return;
                          }
                          
                          NSDictionary *json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                          if ([json[@"status"] isEqualToString:@"success"]) {
                              [self.webView evaluateJavaScript:[NSString stringWithFormat:@"showResult(true, '✅ %@');", json[@"message"]] completionHandler:nil];
                              SaveLicenseKey(code);
                              
                              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.5 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                                  [self hide];
                                  FetchDataFromServer();
                              });
                          } else {
                              NSString *errorMsg = json[@"message"] ? json[@"message"] : @"❌ كود غير صالح أو منتهي";
                              [self.webView evaluateJavaScript:[NSString stringWithFormat:@"showResult(false, '%@');", errorMsg] completionHandler:nil];
                          }
                      });
                  }] resume];
              }
          }
          @end

          void SaveLicenseKey(NSString* key) {
              [[NSUserDefaults standardUserDefaults] setObject:key forKey:@"FalconEyeLicense"];
              [[NSUserDefaults standardUserDefaults] synchronize];
          }

          NSString* GetSavedLicenseKey() {
              return [[NSUserDefaults standardUserDefaults] stringForKey:@"FalconEyeLicense"];
          }

          void FetchDataFromServer() {
              NSString *savedCode = GetSavedLicenseKey();
              NSString *udid = [[UIDevice currentDevice] identifierForVendor].UUIDString;
              NSString* offUrl = [NSString stringWithFormat:@"%@?action=get_offsets&code=%@&udid=%@", apiUrlBase, savedCode, udid];
              
              [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:offUrl] completionHandler:^(NSData *d2, NSURLResponse *r2, NSError *e2) {
                  if (e2) return;
                  if (d2) {
                      NSDictionary *oj = [NSJSONSerialization JSONObjectWithData:d2 options:0 error:nil];
                      if (oj[@"payload"]) {
                          NSData *decoded = [[NSData alloc] initWithBase64EncodedString:oj[@"payload"] options:NSDataBase64DecodingIgnoreUnknownCharacters];
                          NSArray *list = [NSJSONSerialization JSONObjectWithData:decoded options:0 error:nil];
                          if (list) {
                              [[FalconHUD sharedInstance] showHUD];
                              for (NSDictionary *item in list) {
                                  NSString *hexStr = item[@"offset_hex"];
                                  NSString *reportUrl = [NSString stringWithFormat:@"%@?action=mark_injected&hex=%@&code=%@&udid=%@", apiUrlBase, hexStr, savedCode, udid];
                                  [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:reportUrl]] resume];
                              }
                          }
                      }
                  }
              }] resume];
          }

          void AutoLoginCheck() {
              NSString *savedCode = GetSavedLicenseKey();
              if (savedCode && savedCode.length > 0) {
                  NSString *udid = [[UIDevice currentDevice] identifierForVendor].UUIDString;
                  NSString *authUrlStr = [NSString stringWithFormat:@"%@?action=auth&code=%@&udid=%@", apiUrlBase, savedCode, udid];
                  [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:authUrlStr] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                      if (d && !e) {
                          NSDictionary *json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                          if ([json[@"status"] isEqualToString:@"success"]) {
                              FetchDataFromServer(); 
                              return;
                          }
                      }
                      dispatch_async(dispatch_get_main_queue(), ^{
                          [[FalconUI sharedInstance] show];
                      });
                  }] resume];
              } else {
                  [[FalconUI sharedInstance] show];
              }
          }

          __attribute__((constructor)) static void init() {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  AutoLoginCheck();
              });
          }
          EOF

      - name: Build Framework Payload
        run: |
          clang++ -dynamiclib -arch arm64 -x objective-c++ -std=c++17 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -framework Foundation -framework UIKit -framework WebKit \
          -framework QuartzCore -framework CoreGraphics \
          FalconEye.mm -o FalconEye.dylib
          if [ -f FalconEye.dylib ]; then
            strip -x FalconEye.dylib
          fi

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-UI-Engine
          path: FalconEye.dylib
