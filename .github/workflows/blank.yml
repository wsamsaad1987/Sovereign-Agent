name: Falcon Eye - Ultimate Integrated Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_everything:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Falcon Source
        run: |
          cat <<'EOF' > FalconEye.mm
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <mach-o/dyld.h>
          #import <mach/mach.h>
          #import <sys/sysctl.h>
          #import <dlfcn.h>
          #import <objc/runtime.h>
          #include <sys/mman.h>
          #include <vector>
          #include <string>
          #include <unistd.h>
          #include <arpa/inet.h>

          // 🔥 الدمج الذكي لمكتبة JailedHook 🔥
          #if __has_include("Hook/hook.h")
          #import "Hook/hook.h"
          #define JAILED_HOOK_ENABLED 1
          #else
          #define JAILED_HOOK_ENABLED 0
          #endif

          // 🔗 رابط السيرفر
          NSString *apiUrlBase = @"http://34.204.178.160/api.php";

          // ==========================================
          // 🚫 صندوق البلاك لست (القائمة السوداء) 🚫
          // ==========================================
          void Execute_Blacklist_Check() {
              // ⬇️ الصق هنا السترنقات، أسماء أدوات الغش، النصوص البرمجية، والروابط ⬇️
              NSArray *blacklist = @[
                  @"iGameGod",
                  @"ModMenu",
                  @"IGG",
                  @"Shadow",
                  @"Dobby",
                  @"CydiaSubstrate",
                  @"http://example-hack-link.com",
                  // ------- الصق الكلمات الممنوعة تحت هذا الخط -------
                  
                  
                  
                  
                  // ------- نهاية الكلمات الممنوعة -------
              ];

              // 1. فحص مسارات ومكاتب الذاكرة (Loaded Dylibs)
              uint32_t count = _dyld_image_count();
              for (uint32_t i = 0; i < count; i++) {
                  const char *imageName = _dyld_get_image_name(i);
                  if (imageName) {
                      NSString *imgStr = [NSString stringWithUTF8String:imageName];
                      for (NSString *badStr in blacklist) {
                          // إذا وجدنا الكلمة الممنوعة في مسار المكتبة
                          if ([imgStr localizedCaseInsensitiveContainsString:badStr]) {
                              exit(0); // كراش فوري
                          }
                      }
                  }
              }
              
              // 2. فحص الكلاسات المحملة بالذاكرة (Objective-C Classes)
              // (يصيد واجهات الهاك والنصوص البرمجية المحقونة)
              int numClasses = objc_getClassList(NULL, 0);
              if (numClasses > 0) {
                  Class *classes = (__unsafe_unretained Class *)malloc(sizeof(Class) * numClasses);
                  numClasses = objc_getClassList(classes, numClasses);
                  for (int i = 0; i < numClasses; i++) {
                      const char *className = class_getName(classes[i]);
                      if (className) {
                          NSString *clsStr = [NSString stringWithUTF8String:className];
                          for (NSString *badStr in blacklist) {
                              if ([clsStr localizedCaseInsensitiveContainsString:badStr]) {
                                  free(classes);
                                  exit(0); // كراش فوري
                              }
                          }
                      }
                  }
                  free(classes);
              }
          }

          // ==========================================
          // 🛡️ THE 10 GOLDEN ANTI-CRACK POINTS
          // ==========================================
          void Execute_Ultimate_Security_Check() {
              // 1. Anti-Ptrace (مكافحة التصحيح)
              #ifdef __arm64__
              __asm__("mov x0, #31\n" "mov x1, #0\n" "mov x2, #0\n" "mov x3, #0\n" "mov x16, #26\n" "svc #128\n");
              #endif

              // 2. Anti-Sysctl (كشف المراقبة)
              int name[4]; struct kinfo_proc info; size_t size;
              info.kp_proc.p_flag = 0; name[0] = CTL_KERN; name[1] = KERN_PROC; name[2] = KERN_PROC_PID; name[3] = getpid();
              size = sizeof(info);
              sysctl(name, 4, &info, &size, NULL, 0);
              if (info.kp_proc.p_flag & P_TRACED) exit(0);

              // 3. Anti-Proxy / VPN (منع اعتراض الحزم)
              CFDictionaryRef proxySettings = CFNetworkCopySystemProxySettings();
              if (proxySettings) {
                  NSDictionary *dict = (__bridge NSDictionary *)proxySettings;
                  if (dict[@"HTTPProxy"] || dict[@"HTTPSProxy"]) exit(0);
                  CFRelease(proxySettings);
              }

              // 4. Anti-200 Reverse (عكس تقارير 200 وفحص DNS Spoofing)
              NSURL *fakeUrl = [NSURL URLWithString:@"http://nonexistent-falcon-security-check.com"];
              NSMutableURLRequest *fakeReq = [NSMutableURLRequest requestWithURL:fakeUrl];
              fakeReq.timeoutInterval = 2.0;
              [[[NSURLSession sharedSession] dataTaskWithRequest:fakeReq completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (!e && [(NSHTTPURLResponse *)r statusCode] == 200) {
                      exit(0); // تم كشف محاولة عكس التقارير (MitM)
                  }
              }] resume];

              // 5. Anti-Fake Cert (فحص الشهادة المزورة)
              NSString *provPath = [[NSBundle mainBundle] pathForResource:@"embedded" ofType:@"mobileprovision"];
              if (provPath) {
                  NSString *provStr = [NSString stringWithContentsOfFile:provPath encoding:NSASCIIStringEncoding error:nil];
                  if ([provStr containsString:@"AppCake"] || [provStr containsString:@"Cracked"] || [provStr containsString:@"iOSGods"]) {
                      exit(0);
                  }
              }

              // 6. Anti-Fake Receipt (منع وصل الشراء الوهمي LocalIAPStore)
              NSURL *receiptURL = [[NSBundle mainBundle] appStoreReceiptURL];
              if ([[NSFileManager defaultManager] fileExistsAtPath:[receiptURL path]]) {
                  NSDictionary *attr = [[NSFileManager defaultManager] attributesOfItemAtPath:[receiptURL path] error:nil];
                  if ([attr fileSize] < 100) exit(0); // وصل شراء متلاعب به
              }

              // 7. Anti-Frida (مكافحة فريـدا عن طريق البورتات)
              struct sockaddr_in sa;
              int s = socket(AF_INET, SOCK_STREAM, 0);
              sa.sin_family = AF_INET;
              sa.sin_port = htons(27042); // البورت الافتراضي لـ Frida
              inet_pton(AF_INET, "127.0.0.1", &sa.sin_addr);
              if (connect(s, (struct sockaddr *)&sa, sizeof(sa)) == 0) {
                  close(s); exit(0);
              }
              close(s);

              // 8. Anti-Jailbreak (فحص الجلبريك العميق)
              NSArray *jbPaths = @[@"/Applications/Cydia.app", @"/Library/MobileSubstrate/MobileSubstrate.dylib", @"/usr/sbin/sshd"];
              for (NSString *path in jbPaths) {
                  if ([[NSFileManager defaultManager] fileExistsAtPath:path]) exit(0);
              }

              // 9. Environment Check (DYLD_INSERT)
              if (getenv("DYLD_INSERT_LIBRARIES")) exit(0);

              // 10. Anti-Dumping & isatty
              if (isatty(1)) exit(0);
          }

          // Forward Declarations
          uintptr_t GetBase(const char* name);
          void FetchDataFromServer(void);
          void StartHeartbeat(void);
          void CloseAuthWindowAndStart(void);

          UIWindow *g_authWindow = nil;
          static NSString *g_licenseCode = @"";

          void SaveLicenseKey(NSString* key) { 
              g_licenseCode = key; 
              [[NSUserDefaults standardUserDefaults] setObject:key forKey:@"FalconEyeKey"]; 
              [[NSUserDefaults standardUserDefaults] synchronize];
          }
          NSString* GetSavedLicenseKey() { 
              if (g_licenseCode && g_licenseCode.length > 0) return g_licenseCode;
              return [[NSUserDefaults standardUserDefaults] stringForKey:@"FalconEyeKey"] ?: @""; 
          }

          // ==========================================
          // 🕹️ PREMIUM LAMP HUD (شريط اللمبات المضيئة)
          // ==========================================
          @interface FalconHUD : NSObject
          @property (nonatomic, strong) UIWindow *hudWindow;
          @property (nonatomic, strong) UIView *bgView;
          @property (nonatomic, strong) UIView *lampNetwork;
          @property (nonatomic, strong) UIView *lampInject;
          @property (nonatomic, strong) UIView *lampSecurity;
          @property (nonatomic, strong) UILabel *infoLabel;
          @property (nonatomic, assign) BOOL isCollapsed;
          + (instancetype)sharedInstance;
          - (void)showHUD;
          - (void)updateLampsNetwork:(BOOL)netOk injectStatus:(int)injStat;
          @end

          @implementation FalconHUD
          + (instancetype)sharedInstance {
              static FalconHUD *shared = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{ shared = [[FalconHUD alloc] init]; });
              return shared;
          }

          - (UIView *)createGlowingLamp:(UIColor *)color {
              UIView *lamp = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 8, 8)];
              lamp.backgroundColor = color;
              lamp.layer.cornerRadius = 4;
              lamp.layer.shadowColor = color.CGColor;
              lamp.layer.shadowOffset = CGSizeZero;
              lamp.layer.shadowRadius = 4;
              lamp.layer.shadowOpacity = 1.0;
              
              CABasicAnimation *pulse = [CABasicAnimation animationWithKeyPath:@"shadowOpacity"];
              pulse.fromValue = @(0.4); pulse.toValue = @(1.0);
              pulse.duration = 0.8; pulse.autoreverses = YES; pulse.repeatCount = HUGE_VALF;
              [lamp.layer addAnimation:pulse forKey:@"pulse"];
              
              return lamp;
          }

          - (void)showHUD {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (self.hudWindow) return;
                  CGFloat sw = [UIScreen mainScreen].bounds.size.width;
                  self.isCollapsed = NO;
                  
                  self.hudWindow = [[UIWindow alloc] initWithFrame:CGRectMake(sw/2 - 100, 35, 200, 26)];
                  self.hudWindow.windowLevel = UIWindowLevelAlert + 2000;
                  self.hudWindow.backgroundColor = [UIColor clearColor];
                  self.hudWindow.userInteractionEnabled = YES; 
                  
                  self.bgView = [[UIView alloc] initWithFrame:self.hudWindow.bounds];
                  self.bgView.backgroundColor = [UIColor colorWithWhite:0 alpha:0.8];
                  self.bgView.layer.cornerRadius = 13;
                  self.bgView.layer.borderWidth = 1.0;
                  self.bgView.layer.borderColor = [UIColor colorWithRed:0 green:0.8 blue:1 alpha:0.3].CGColor;
                  [self.hudWindow addSubview:self.bgView];
                  
                  UIStackView *stack = [[UIStackView alloc] initWithFrame:CGRectMake(15, 0, 170, 26)];
                  stack.axis = UILayoutConstraintAxisHorizontal;
                  stack.spacing = 10;
                  stack.alignment = UIStackViewAlignmentCenter;
                  stack.distribution = UIStackViewDistributionEqualSpacing;
                  
                  self.lampNetwork = [self createGlowingLamp:[UIColor yellowColor]]; 
                  self.lampInject = [self createGlowingLamp:[UIColor redColor]];    
                  self.lampSecurity = [self createGlowingLamp:[UIColor purpleColor]]; 
                  
                  self.infoLabel = [[UILabel alloc] init];
                  self.infoLabel.font = [UIFont fontWithName:@"Menlo-Bold" size:10];
                  self.infoLabel.textColor = [UIColor whiteColor];
                  self.infoLabel.text = @"FALCON VIP";
                  
                  UIStackView *lampsStack = [[UIStackView alloc] init];
                  lampsStack.axis = UILayoutConstraintAxisHorizontal; lampsStack.spacing = 8;
                  [lampsStack addArrangedSubview:self.lampNetwork];
                  [lampsStack addArrangedSubview:self.lampInject];
                  [lampsStack addArrangedSubview:self.lampSecurity];
                  
                  [stack addArrangedSubview:lampsStack];
                  [stack addArrangedSubview:self.infoLabel];
                  
                  [self.bgView addSubview:stack];
                  
                  UITapGestureRecognizer *tap = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(toggleHUD)];
                  [self.hudWindow addGestureRecognizer:tap];
                  [self.hudWindow makeKeyAndVisible];
                  
                  [[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(onCapture:) name:UIScreenCapturedDidChangeNotification object:nil];
              });
          }

          - (void)onCapture:(NSNotification *)n { self.hudWindow.hidden = [UIScreen mainScreen].isCaptured; }

          - (void)toggleHUD {
              self.isCollapsed = !self.isCollapsed;
              CGFloat sw = [UIScreen mainScreen].bounds.size.width;
              [UIView animateWithDuration:0.3 animations:^{
                  if (self.isCollapsed) {
                      self.hudWindow.frame = CGRectMake(sw/2 - 20, 35, 40, 26);
                      self.bgView.frame = self.hudWindow.bounds;
                      self.infoLabel.alpha = 0;
                  } else {
                      self.hudWindow.frame = CGRectMake(sw/2 - 100, 35, 200, 26);
                      self.bgView.frame = self.hudWindow.bounds;
                      self.infoLabel.alpha = 1;
                  }
              }];
          }

          - (void)updateLampsNetwork:(BOOL)netOk injectStatus:(int)injStat {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIColor *netColor = netOk ? [UIColor greenColor] : [UIColor redColor];
                  self.lampNetwork.backgroundColor = netColor;
                  self.lampNetwork.layer.shadowColor = netColor.CGColor;
                  
                  UIColor *injColor = [UIColor redColor];
                  if (injStat == 1) injColor = [UIColor yellowColor];
                  else if (injStat == 2) injColor = [UIColor cyanColor];
                  self.lampInject.backgroundColor = injColor;
                  self.lampInject.layer.shadowColor = injColor.CGColor;
              });
          }
          @end

          // ==========================================
          // 🚀 GHOST CYCLE ENGINE
          // ==========================================
          uintptr_t GetBase(const char* name) {
              if (strstr(name, "ShadowTrackerExtra") || strlen(name) == 0) return (uintptr_t)_dyld_get_image_header(0);
              for (uint32_t i = 0; i < _dyld_image_count(); i++) {
                  if (strstr(_dyld_get_image_name(i), name)) return (uintptr_t)_dyld_get_image_header(i);
              }
              return 0;
          }

          void _ghost_nop() { return; }

          void GhostCycleLoop(NSMutableArray *offsetsList) {
              [[FalconHUD sharedInstance] updateLampsNetwork:YES injectStatus:1]; 
              
              int total = (int)offsetsList.count;
              int batchSize = 4;
              
              for (int i = 0; i < total; i += batchSize) {
                  std::vector<void*> targets;
                  std::vector<void*> replacements;
                  NSMutableArray *currentBatchItems = [NSMutableArray array];

                  for (int j = i; j < i + batchSize && j < total; j++) {
                      NSMutableDictionary *item = offsetsList[j];
                      NSString *hexStr = [[item[@"offset_hex"] stringByReplacingOccurrencesOfString:@"0x" withString:@""] stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceCharacterSet]];
                      uintptr_t off = strtoull(hexStr.UTF8String, NULL, 16);
                      
                      if (off > 0) {
                          uintptr_t base = GetBase("ShadowTrackerExtra");
                          targets.push_back((void*)(base + off));
                          replacements.push_back((void*)_ghost_nop);
                          [currentBatchItems addObject:item];
                      }
                  }

                  if (targets.size() > 0) {
                      #if JAILED_HOOK_ENABLED
                      hook(targets.data(), replacements.data(), targets.size());
                      [NSThread sleepForTimeInterval:0.5];
                      #endif

                      for (NSMutableDictionary *item in currentBatchItems) {
                          NSString *rawUrl = [NSString stringWithFormat:@"%@?action=mark_injected&hex=%@&code=%@&udid=%@", apiUrlBase, item[@"offset_hex"], GetSavedLicenseKey(), [[UIDevice currentDevice] identifierForVendor].UUIDString];
                          [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:[rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]]]] resume];
                      }
                  }
              }
              [[FalconHUD sharedInstance] updateLampsNetwork:YES injectStatus:2]; 
          }

          void FetchDataFromServer() {
              [[FalconHUD sharedInstance] showHUD];
              [[FalconHUD sharedInstance] updateLampsNetwork:YES injectStatus:0];
              
              NSString *rawUrl = [NSString stringWithFormat:@"%@?action=get_offsets&code=%@&udid=%@", apiUrlBase, GetSavedLicenseKey(), [[UIDevice currentDevice] identifierForVendor].UUIDString];
              [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:[rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]]] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (d) {
                      NSDictionary *oj = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                      if ([oj[@"status"] isEqualToString:@"success"] && oj[@"payload"]) {
                          NSArray *list = [NSJSONSerialization JSONObjectWithData:[[NSData alloc] initWithBase64EncodedString:oj[@"payload"] options:0] options:0 error:nil];
                          NSMutableArray *mList = [NSMutableArray array];
                          for (NSDictionary *dict in list) { [mList addObject:[dict mutableCopy]]; }
                          dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_HIGH, 0), ^{ GhostCycleLoop(mList); });
                      }
                  } else {
                      [[FalconHUD sharedInstance] updateLampsNetwork:NO injectStatus:0]; 
                  }
              }] resume];
          }

          void StartHeartbeat() {
              static dispatch_source_t timer = nil;
              if (timer) return;
              timer = dispatch_source_create(DISPATCH_SOURCE_TYPE_TIMER, 0, 0, dispatch_get_main_queue());
              dispatch_source_set_timer(timer, DISPATCH_TIME_NOW, 5.0 * NSEC_PER_SEC, 5.0 * NSEC_PER_SEC);
              dispatch_source_set_event_handler(timer, ^{
                  
                  // 🔥 فحص الحماية הـ 10 نقاط + فحص البلاك لست كل 5 ثواني
                  Execute_Ultimate_Security_Check(); 
                  Execute_Blacklist_Check();

                  NSString *rawUrl = [NSString stringWithFormat:@"%@?action=check_status&code=%@&udid=%@", apiUrlBase, GetSavedLicenseKey(), [[UIDevice currentDevice] identifierForVendor].UUIDString];
                  [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:[rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]]] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                      if (d) {
                          NSDictionary *j = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                          dispatch_async(dispatch_get_main_queue(), ^{
                              if ([j[@"maintenance"] intValue] == 1 || [j[@"maintenance"] isEqualToString:@"ON"]) exit(0); 
                          });
                      }
                  }] resume];
              });
              dispatch_resume(timer);
          }

          // ==========================================
          // 🔒 Auth View Controller
          // ==========================================
          @interface FalconAuthViewController : UIViewController <WKScriptMessageHandler>
          @property (nonatomic, strong) WKWebView *webView;
          @end
          @implementation FalconAuthViewController
          - (void)viewDidLoad {
              [super viewDidLoad]; self.view.backgroundColor = [UIColor blackColor];
              WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
              [config.userContentController addScriptMessageHandler:self name:@"falconAuth"];
              self.webView = [[WKWebView alloc] initWithFrame:self.view.bounds configuration:config];
              [self.view addSubview:self.webView];
              NSString *html = @"<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><script src='https://cdn.tailwindcss.com'></script></head><body class='bg-transparent flex items-center justify-center h-screen'><div class='bg-slate-900/95 p-8 rounded-3xl border border-blue-500/50 w-80 text-center shadow-2xl'><h1 class='text-2xl font-black text-white mb-6 italic'>FALCON <span class='text-blue-500'>EYE</span></h1><input type='text' id='k' placeholder='كود التفعيل' class='w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white text-center mb-4 outline-none'><button onclick='auth()' id='b' class='w-full bg-blue-600 text-white font-bold py-3 rounded-xl active:scale-95 transition-all'>دخول</button><p id='m' class='mt-4 text-[10px] text-blue-400 font-bold uppercase'></p></div><script>function auth(){ let c=document.getElementById('k').value; if(!c)return; document.getElementById('m').innerText='⏳ جاري التحقق...'; window.webkit.messageHandlers.falconAuth.postMessage({action:'auth', code:c}); } function showResult(s, msg){ if(s){ document.getElementById('m').innerText='✅ تم التفعيل!'; setTimeout(()=>window.webkit.messageHandlers.falconAuth.postMessage({action:'close'}),1000); } else { document.getElementById('m').innerText='❌ '+msg; } }</script></body></html>";
              [self.webView loadHTMLString:html baseURL:nil];
          }
          - (void)userContentController:(WKUserContentController *)u didReceiveScriptMessage:(WKScriptMessage *)m {
              NSDictionary *d = m.body;
              if ([d[@"action"] isEqualToString:@"auth"]) {
                  NSString *rawUrl = [NSString stringWithFormat:@"%@?action=auth&code=%@&udid=%@", apiUrlBase, d[@"code"], [[UIDevice currentDevice] identifierForVendor].UUIDString];
                  [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:[rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]]] completionHandler:^(NSData *da, NSURLResponse *r, NSError *e) {
                      if (da) {
                          NSDictionary *j = [NSJSONSerialization JSONObjectWithData:da options:0 error:nil];
                          dispatch_async(dispatch_get_main_queue(), ^{
                              if ([j[@"status"] isEqualToString:@"success"]) { SaveLicenseKey(d[@"code"]); [self.webView evaluateJavaScript:@"showResult(true,'')" completionHandler:nil]; }
                              else { [self.webView evaluateJavaScript:[NSString stringWithFormat:@"showResult(false,'%@')", j[@"message"]] completionHandler:nil]; }
                          });
                      }
                  }] resume];
              } else if ([d[@"action"] isEqualToString:@"close"]) { CloseAuthWindowAndStart(); }
          }
          @end

          void CloseAuthWindowAndStart() {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (g_authWindow) { [g_authWindow setHidden:YES]; g_authWindow = nil; }
                  FetchDataFromServer(); StartHeartbeat();
              });
          }

          __attribute__((constructor)) static void init() {
              // 🛡️ تشغيل الفحوصات الأمنية فور بدء اللعبة
              Execute_Ultimate_Security_Check();
              Execute_Blacklist_Check();

              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  NSString *k = GetSavedLicenseKey();
                  if (k.length > 0) { CloseAuthWindowAndStart(); }
                  else {
                      g_authWindow = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                      g_authWindow.windowLevel = UIWindowLevelAlert + 1000;
                      g_authWindow.rootViewController = [[FalconAuthViewController alloc] init];
                      [g_authWindow makeKeyAndVisible];
                  }
              });
          }
          EOF

      - name: Build Framework Payload
        run: |
          if [ -d "Hook" ]; then
            python3 -c '
          import os, re, glob
          for f in glob.glob("Hook/*.[ch]"):
              with open(f, "r") as file: content = file.read()
              content = re.sub(r"\bnew\b", "new_ptr", content)
              with open(f, "w") as file: file.write(content)
          ' || true
          fi
          HOOK_FILES=$(ls Hook/*.c Hook/*.cpp Hook/*.m Hook/*.mm 2>/dev/null | tr '\n' ' ')
          clang++ -dynamiclib -arch arm64 -x objective-c++ -std=c++17 -fobjc-arc \
          -undefined dynamic_lookup -miphoneos-version-min=12.0 -lobjc \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -framework Foundation -framework UIKit -framework WebKit \
          -framework QuartzCore -framework CoreGraphics \
          FalconEye.mm $HOOK_FILES -o FalconEye.dylib
          if [ -f FalconEye.dylib ]; then strip -x FalconEye.dylib; else exit 1; fi

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-Ultimate-Engine
          path: FalconEye.dylib
