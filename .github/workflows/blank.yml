          #include <libkern/OSCacheControl.h>
          #include <vector>
          #include <map>
          #include <string>

          #define RADAR_URL @"http://127.0.0.1/log" // مسار وهمي لتجنب كراش الشبكة

          NSString *apiUrlBase = @"http://34.204.178.160/api.php";

          // Forward Declarations
          uintptr_t GetBase(const char* name);
          bool Patch(uintptr_t addr, std::vector<uint8_t> data);
          void FetchDataFromServer(void);
          void StartHeartbeat(void);
          void AutoLoginCheck(void);
          void ActivateV80(void);

          void SaveLicenseKey(NSString* key) { [[NSUserDefaults standardUserDefaults] setObject:key forKey:@"FalconEyeKey"]; }
          NSString* GetSavedLicenseKey() { return [[NSUserDefaults standardUserDefaults] stringForKey:@"FalconEyeKey"]; }

          // دالة تشفير النصوص لمنع كراش الجافاسكريبت
          NSString* EncodeB64(NSString* input) {
              NSData* data = [input dataUsingEncoding:NSUTF8StringEncoding];
              return [data base64EncodedStringWithOptions:0];
          }

          // ==========================================
          // 👻 إخفاء الدايلب من النظام (Ghost Mode)
          // ==========================================
          void HideMyDylib() {
              uint32_t count = _dyld_image_count();
              for (uint32_t i = 0; i < count; i++) {
                  const char *name = _dyld_get_image_name(i);
                  if (name && strstr(name, "FalconEye")) {
                      struct mach_header_64 *header = (struct mach_header_64 *)(_dyld_get_image_header(i));
                      mach_port_t task = mach_task_self();
                      vm_protect(task, (vm_address_t)header, sizeof(uint32_t), FALSE, VM_PROT_READ | VM_PROT_WRITE | VM_PROT_COPY);
                      header->magic = 0; // مسح رأس الملف لتعمية برامج فحص الذاكرة
                      vm_protect(task, (vm_address_t)header, sizeof(uint32_t), FALSE, VM_PROT_READ | VM_PROT_EXECUTE);
                      NSLog(@"[Falcon] 👻 Dylib hidden from memory scanners.");
                      break;
                  }
              }
          }

          // ==========================================
          // 🛡️ V80 IMPERIAL ANTI-CHEAT SYSTEM
          // ==========================================
          void SilentLog(NSString *msg) {
              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_BACKGROUND, 0), ^{
                  NSLog(@"[Falcon V80] %@", msg);
              });
          }

          typedef BOOL (*fileExistsAtPath_t)(id, SEL, NSString *);
          fileExistsAtPath_t orig_fileExistsAtPath;

          BOOL hk_fileExistsAtPath(id self, SEL _cmd, NSString *path) {
              if ([path containsString:@"Cydia"] || [path containsString:@"Shadow"] || [path containsString:@"Imperial"] || [path containsString:@"libdobby"]) {
                  return NO;
              }
              return orig_fileExistsAtPath(self, _cmd, path);
          }

          void SetupSignatureSpoof() {
              Method m_info = class_getInstanceMethod([NSBundle class], @selector(infoDictionary));
              IMP orig_info = method_getImplementation(m_info);
              method_setImplementation(m_info, imp_implementationWithBlock(^NSDictionary* (id self) {
                  NSMutableDictionary *dict = [((NSDictionary*(*)(id, SEL))orig_info)(self, @selector(infoDictionary)) mutableCopy];
                  [dict setObject:@"Apple iPhone OS Application Signer" forKey:@"SignerIdentity"];
                  [dict setObject:@"com.apple.itunes.store" forKey:@"AppStoreInstaller"];
                  return dict;
              }));
          }

          void SetupReceiptSpoof() {
              Method m_receipt = class_getInstanceMethod([NSBundle class], @selector(appStoreReceiptURL));
              method_setImplementation(m_receipt, imp_implementationWithBlock(^NSURL* (id self) {
                  return [NSURL fileURLWithPath:@"/System/Library/PrivateFrameworks/StoreServices.framework/receipt"];
              }));
          }

          void SetupIdentitySpoof() {
              method_setImplementation(class_getInstanceMethod([NSBundle class], @selector(bundleIdentifier)), imp_implementationWithBlock(^NSString* (id self) { return @"com.tencent.ig"; }));
              method_setImplementation(class_getInstanceMethod([UIDevice class], @selector(model)), imp_implementationWithBlock(^NSString* (id self) { return @"iPad"; }));
              method_setImplementation(class_getInstanceMethod([UIDevice class], @selector(name)), imp_implementationWithBlock(^NSString* (id self) { return @"iPad Pro (12.9-inch)"; }));
              method_setImplementation(class_getInstanceMethod([UIDevice class], @selector(systemVersion)), imp_implementationWithBlock(^NSString* (id self) { return @"17.4"; }));
          }

          void SetupClipboardProtection() {
              Method m_pasteboard = class_getInstanceMethod([UIPasteboard class], @selector(string));
              method_setImplementation(m_pasteboard, imp_implementationWithBlock(^NSString* (id self) {
                  return @""; 
              }));
          }

          void SetupHardwareSpoof() {
              Method m_ram = class_getInstanceMethod([NSProcessInfo class], @selector(physicalMemory));
              method_setImplementation(m_ram, imp_implementationWithBlock(^unsigned long long(id self) {
                  return 17179869184ULL; 
              }));
              
              Method m_cpu = class_getInstanceMethod([NSProcessInfo class], @selector(activeProcessorCount));
              method_setImplementation(m_cpu, imp_implementationWithBlock(^NSUInteger(id self) {
                  return 8; 
              }));
          }

          void ActivateV80() {
              SetupIdentitySpoof();       
              SetupSignatureSpoof();      
              SetupReceiptSpoof();        
              SetupClipboardProtection(); 
              SetupHardwareSpoof();       

              Method m_file = class_getInstanceMethod([NSFileManager class], @selector(fileExistsAtPath:));
              orig_fileExistsAtPath = (fileExistsAtPath_t)method_getImplementation(m_file);
              method_setImplementation(m_file, imp_implementationWithBlock(^BOOL (id self, NSString *path) {
                  return hk_fileExistsAtPath(self, @selector(fileExistsAtPath:), path);
              }));

              SilentLog(@"✅ V80 Active: Full Shield + Hardware Spoof + Ghost Mode");
          }

          // ==========================================
          // 🔒 Auth View Controller (VIP Login UI)
          // ==========================================
          @interface FalconAuthViewController : UIViewController <WKScriptMessageHandler>
          @property (nonatomic, strong) WKWebView *webView;
          @end

          @implementation FalconAuthViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor blackColor];
              
              WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
              [config.userContentController addScriptMessageHandler:self name:@"falconAuth"];
              
              self.webView = [[WKWebView alloc] initWithFrame:self.view.bounds configuration:config];
              self.webView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              self.webView.backgroundColor = [UIColor blackColor];
              self.webView.opaque = NO;
              self.webView.scrollView.scrollEnabled = NO;
              self.webView.scrollView.bounces = NO;
              
              [self.view addSubview:self.webView];
              
              // 🔥 واجهة تسجيل الدخول المدمجة مع الأنيميشن السحري (الفيكة) 🔥
              NSString *html = @"<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><script src='https://cdn.tailwindcss.com'></script><style>body { background: #000; margin: 0; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; user-select: none; } .glass { background: rgba(10, 15, 30, 0.95); border: 1px solid rgba(59, 130, 246, 0.4); border-radius: 20px; padding: 35px; width: 420px; box-shadow: 0 0 40px rgba(59,130,246,0.2); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); min-height: 250px; display: flex; flex-direction: column; justify-content: center; } .log-box { font-size: 13px; color: #10b981; text-align: center; display: none; line-height: 2; text-shadow: 0 0 8px rgba(16,185,129,0.5); font-weight: bold; letter-spacing: 2px; } .fade-in-out { animation: fadeInOut 1.2s ease-in-out forwards; } @keyframes fadeInOut { 0% { opacity: 0; transform: translateY(10px); } 20% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-10px); } } .glow-success { box-shadow: 0 0 60px rgba(16, 185, 129, 0.4); border-color: #10b981; }</style></head><body><div class='glass' id='box'><div id='content'><h1 class='text-3xl font-black text-white italic mb-1 tracking-tighter text-center'>FALCON<span class='text-blue-500'>EYE</span></h1><p class='text-[10px] text-blue-400 font-bold tracking-widest mb-6 uppercase text-center'>Advanced Security Protocol</p><div class='relative mb-5'><input type='text' id='k' placeholder='ENTER LICENSE KEY' class='w-full bg-[#020617] border border-blue-500/30 rounded-xl p-4 pl-16 text-white text-center outline-none focus:border-blue-500 transition-all font-bold text-sm tracking-widest'><button onclick='pasteKey()' class='absolute left-2 top-1/2 -translate-y-1/2 bg-blue-600/20 hover:bg-blue-600/40 px-3 py-2 rounded-lg text-[10px] text-blue-400 font-bold uppercase transition-all'>PASTE</button></div><button onclick='startAuth()' id='btn' class='w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3.5 rounded-xl shadow-lg active:scale-95 transition-all text-sm uppercase tracking-widest'>INITIALIZE</button></div><div id='logs' class='log-box'></div></div><script>function pasteKey(){ window.webkit.messageHandlers.falconAuth.postMessage({action:'paste'}); } function setKey(val){ document.getElementById('k').value = val; } async function startAuth(){ var c = document.getElementById('k').value.trim(); if(!c) return; document.getElementById('content').style.display = 'none'; const logs = document.getElementById('logs'); logs.style.display = 'block'; const fakeLines = ['>_ CONNECTING TO [SECURE_SERVER]...', '>_ BYPASSING KERNEL SECURITY...', '>_ INJECTING V80 PAYLOAD...', '>_ VERIFYING LICENSE KEY...']; for(let line of fakeLines){ logs.innerHTML = '<div class=\"fade-in-out\">' + line + '</div>'; await new Promise(r => setTimeout(r, 1200)); } window.webkit.messageHandlers.falconAuth.postMessage({action:'auth', code: c}); } function showResult(isSuccess, b64Message){ const logs = document.getElementById('logs'); if(isSuccess){ document.getElementById('box').classList.add('glow-success'); logs.innerHTML = '<div style=\"color:#10b981; font-size:16px; animation: none; opacity: 1;\">[✅] SYSTEM ACTIVATED</div>'; } else { try { let msg = decodeURIComponent(escape(window.atob(b64Message))); logs.innerHTML = '<div style=\"color:#ef4444; animation: none; opacity: 1;\">[❌] ' + msg + '</div>'; } catch(e){ logs.innerHTML = '<div style=\"color:#ef4444; animation: none; opacity: 1;\">[❌] VERIFICATION FAILED</div>'; } setTimeout(() => { document.getElementById('content').style.display = 'block'; logs.style.display = 'none'; logs.innerHTML = ''; }, 2500); } }</script></body></html>";
              
              [self.webView loadHTMLString:html baseURL:nil];
          }

          - (void)userContentController:(WKUserContentController *)userContentController didReceiveScriptMessage:(WKScriptMessage *)message {
              NSDictionary *data = (NSDictionary *)message.body;
              if ([data[@"action"] isEqualToString:@"paste"]) {
                  NSString *p = [UIPasteboard generalPasteboard].string;
                  if (p) {
                      p = [p stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
                      [self.webView evaluateJavaScript:[NSString stringWithFormat:@"setKey('%@')", p] completionHandler:nil];
                  }
              } else if ([data[@"action"] isEqualToString:@"auth"]) {
                  NSString *c = [data[@"code"] stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
                  NSString *u = [[UIDevice currentDevice] identifierForVendor].UUIDString;
                  
                  NSString *rawUrl = [NSString stringWithFormat:@"%@?action=auth&code=%@&udid=%@", apiUrlBase, c, u];
                  NSString *encodedUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
                  
                  [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encodedUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                      dispatch_async(dispatch_get_main_queue(), ^{
                          if (e || !d) { 
                              NSString *errorMsg = @"SERVER UNREACHABLE";
                              [self.webView evaluateJavaScript:[NSString stringWithFormat:@"showResult(false, '%@')", EncodeB64(errorMsg)] completionHandler:nil];
                              return; 
                          }
                          
                          NSDictionary *json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                          if ([json[@"status"] isEqualToString:@"success"]) {
                              SaveLicenseKey(c);
                              [self.webView evaluateJavaScript:@"showResult(true, '')" completionHandler:nil];
                              
                              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.5 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                                  [self dismissViewControllerAnimated:YES completion:^{
                                      FetchDataFromServer();
                                      ActivateV80(); // تفعيل المنظومة الإمبراطورية بعد نجاح الدخول
                                  }];
                              });
                          } else {
                              NSString *errMsg = json[@"message"] ?: @"INVALID KEY";
                              [self.webView evaluateJavaScript:[NSString stringWithFormat:@"showResult(false, '%@')", EncodeB64(errMsg)] completionHandler:nil];
                          }
                      });
                  }] resume];
              }
          }
          @end

          // ==========================================
          // 🛡️ UI Manager & Maintenance Screen
          // ==========================================
          @interface FalconUI : NSObject
          + (void)showAuthScreen;
          + (void)showMaintenanceScreen:(NSString *)msg;
          + (void)hideMaintenanceScreen;
          @end

          static UIWindow *authWindow = nil;
          static UIViewController *maintenanceVC = nil;

          @implementation FalconUI
          + (void)showAuthScreen {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (authWindow) return;
                  
                  authWindow = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                  authWindow.windowLevel = UIWindowLevelAlert + 1000;
                  authWindow.rootViewController = [[FalconAuthViewController alloc] init];
                  [authWindow makeKeyAndVisible];
              });
          }

          + (void)showMaintenanceScreen:(NSString *)msg {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (maintenanceVC) return;
                  
                  UIWindow *window = nil;
                  if (@available(iOS 13.0, *)) {
                      for (UIWindowScene* scene in [UIApplication sharedApplication].connectedScenes) {
                          if (scene.activationState == UISceneActivationStateForegroundActive) { window = scene.windows.firstObject; break; }
                      }
                  }
                  if (!window) window = [UIApplication sharedApplication].keyWindow;

                  if (window && window.rootViewController) {
                      maintenanceVC = [[UIViewController alloc] init];
                      maintenanceVC.view.backgroundColor = [UIColor colorWithWhite:0 alpha:0.95];
                      
                      UILabel *lbl = [[UILabel alloc] initWithFrame:CGRectMake(0, 0, window.bounds.size.width, 100)];
                      lbl.center = maintenanceVC.view.center;
                      lbl.textAlignment = NSTextAlignmentCenter;
                      lbl.font = [UIFont boldSystemFontOfSize:22];
                      lbl.textColor = [UIColor redColor];
                      lbl.numberOfLines = 0;
                      lbl.text = [NSString stringWithFormat:@"⚠️ SYSTEM FROZEN:\n%@", msg];
                      
                      [maintenanceVC.view addSubview:lbl];
                      maintenanceVC.modalPresentationStyle = UIModalPresentationOverFullScreen;
                      [window.rootViewController presentViewController:maintenanceVC animated:NO completion:nil];
                  }
              });
          }

          + (void)hideMaintenanceScreen {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (maintenanceVC) {
                      [maintenanceVC dismissViewControllerAnimated:NO completion:nil];
                      maintenanceVC = nil;
                  }
              });
          }
          @end

          // ==========================================
          // 🚀 Safe COW Patching (No Jailbreak)
          // ==========================================
          uintptr_t GetBase(const char* name) {
              uint32_t count = _dyld_image_count();
              for (uint32_t i = 0; i < count; i++) {
                  if (strstr(_dyld_get_image_name(i), name)) return _dyld_get_image_vmaddr_slide(i) + 0x100000000;
              }
              return 0;
          }

          bool Patch(uintptr_t addr, std::vector<uint8_t> data) {
              if (addr == 0 || data.empty()) return false;
              
              mach_port_t task = mach_task_self();
              vm_size_t size = data.size();
              
              vm_address_t page_start = addr & ~PAGE_MASK;
              vm_size_t page_size = PAGE_SIZE;

              kern_return_t kr = vm_protect(task, page_start, page_size, FALSE, VM_PROT_READ | VM_PROT_WRITE | VM_PROT_COPY);
              if (kr != KERN_SUCCESS) return false;

              kr = vm_write(task, addr, (vm_offset_t)data.data(), (mach_msg_type_number_t)size);
              vm_protect(task, page_start, page_size, FALSE, VM_PROT_READ | VM_PROT_EXECUTE);
              sys_icache_invalidate((void*)addr, size);
              
              return kr == KERN_SUCCESS;
          }

          // ==========================================
          // 🚀 Injection Logic (Smart Array for Multiple Targets)
          // ==========================================
          void SafeInjectLoop(NSMutableArray *offsetsList) {
              static int attempts = 0;
              if (attempts > 100) return; 
              
              BOOL allInjected = YES;

              for (NSMutableDictionary *item in offsetsList) {
                  if ([item[@"injected"] boolValue]) continue;

                  NSString *targetModule = item[@"target_module"];
                  // في حال كان الهدف فارغاً من اللوحة نعتبره ShadowTrackerExtra
                  if (!targetModule || targetModule.length == 0) targetModule = @"ShadowTrackerExtra";
                  
                  uintptr_t base = GetBase([targetModule UTF8String]);
                  
                  if (base > 0) {
                      uintptr_t off = strtoull([item[@"offset_hex"] UTF8String], NULL, 16);
                      // 🔥 حقن بايتات التعطيل الجديدة (NOP ARM64: 1F 20 03 D5)
                      if (Patch(base + off, {0x1F, 0x20, 0x03, 0xD5})) {
                          [item setValue:@YES forKey:@"injected"];
                          
                          // إرسال تبليغ للسيرفر لإضاءة اللمبة الخضراء
                          NSString *url = [NSString stringWithFormat:@"%@?action=mark_injected&hex=%@&code=%@&udid=%@", apiUrlBase, item[@"offset_hex"], GetSavedLicenseKey(), [[UIDevice currentDevice] identifierForVendor].UUIDString];
                          [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:url]] resume];
                      } else {
                          allInjected = NO;
                      }
                  } else {
                      allInjected = NO;
                  }
              }
              
              if (!allInjected) {
                  attempts++;
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                      SafeInjectLoop(offsetsList);
                  });
              }
          }

          void FetchDataFromServer() {
              NSString *code = GetSavedLicenseKey();
              NSString *udid = [[UIDevice currentDevice] identifierForVendor].UUIDString;
              NSString *url = [NSString stringWithFormat:@"%@?action=get_offsets&code=%@&udid=%@", apiUrlBase, code, udid];
              
              [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:url] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (d) {
                      NSDictionary *oj = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                      if (oj[@"payload"]) {
                          NSData *decoded = [[NSData alloc] initWithBase64EncodedString:oj[@"payload"] options:0];
                          NSArray *list = [NSJSONSerialization JSONObjectWithData:decoded options:0 error:nil];
                          
                          NSMutableArray *mutableList = [NSMutableArray array];
                          for (NSDictionary *dict in list) {
                              [mutableList addObject:[dict mutableCopy]];
                          }

                          if (mutableList.count > 0) {
                              SafeInjectLoop(mutableList);
                          }
                      }
                  }
              }] resume];
          }

          void AutoLoginCheck() {
              NSString *k = GetSavedLicenseKey();
              if (k && k.length > 0) {
                  NSString *u = [[UIDevice currentDevice] identifierForVendor].UUIDString;
                  NSString *rawUrl = [NSString stringWithFormat:@"%@?action=auth&code=%@&udid=%@", apiUrlBase, k, u];
                  NSString *encodedUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
                  
                  [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encodedUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                      dispatch_async(dispatch_get_main_queue(), ^{
                          if (d && !e) {
                              NSDictionary *j = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                              if ([j[@"status"] isEqualToString:@"success"]) { 
                                  if (authWindow) { authWindow.hidden = YES; authWindow = nil; }
                                  FetchDataFromServer();
                                  ActivateV80();
                                  return; 
                              }
                          }
                          [FalconUI showAuthScreen];
                      });
                  }] resume];
              } else {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [FalconUI showAuthScreen];
                  });
              }
          }

          __attribute__((constructor)) static void init() {
              HideMyDylib(); // إخفاء الدايلب فوراً قبل بدء أي شيء
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  AutoLoginCheck();
              });
          }
          EOF

      - name: Build Framework Payload
        run: |
          clang++ -dynamiclib -arch arm64 -x objective-c++ -std=c++17 -fobjc-arc \
          -undefined dynamic_lookup \
          -miphoneos-version-min=12.0 -lobjc \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -framework Foundation -framework UIKit -framework WebKit \
          -framework QuartzCore -framework CoreGraphics \
          FalconEye.mm -o FalconEye.dylib
          
          if [ -f FalconEye.dylib ]; then strip -x FalconEye.dylib; else exit 1; fi

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-Ultimate-Engine
          path: FalconEye.dylib
          if-no-files-found: error
