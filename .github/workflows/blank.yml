name: Falcon Eye - Ultimate Integrated Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_everything:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Falcon Source
        run: |
          cat <<'EOF' > FalconEye.mm
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <mach-o/dyld.h>
          #import <mach/mach.h>
          #include <vector>
          #include <map>
          #include <string>

          /* ==========================================
             🛡️ CRYZER ANTI-CHEAT STRUCTURES
             ========================================== */
          @interface ASTExtraBaseCharacter : NSObject
          @property (assign) BOOL bRecordKillData, IsEnableReportRoute, IsEnableLogAIPlayerPos, IsEnableReportPlayerKillFlow;
          @property (assign) BOOL IsEnableReportGameSetting, EnableReverseVerityBlock, bDetectingPaintDecalTarget;
          @property (assign) BOOL IsEnableReportMrpcsInCircleFlow, IsEnableReportMrpcsInPartCircleFlow, IsEnableReportMrpcsFlow;
          @property (assign) int EnableReportGameSettingLevel;
          @end

          @interface UWeaponAntiCheatComp : NSObject
          @property (assign) float ShootRateCheckInterval, ShootRateCheckMulCoff, ShootTimeInfoCheckClearInterval, ShootTimeInfoCheckLifeTime;
          @property (assign) float TimeLineCheckDnBorder, TimeLineCheckUpBorder;
          @property (assign) BOOL ShootRateCheckTag, bVerifyStartFireTime, bVerifyTimeLineSync;
          @end

          @interface USTExtraShootWeaponComponent : NSObject
          @property (assign) BOOL bSkipVerifyShootIDValidity, bSkipVerifyStartFire;
          @end

          struct PunishThreshold { int PunishThresHold; bool bShouldPunish; };
          @interface UPlayerAntiCheatManager : NSObject
          @property (assign) struct PunishThreshold CheatStateData2TotalCheatTimes, MoveCheatAntiStrategy3TotalCheatTimes, VsNoHitDetail;
          @property (assign) struct PunishThreshold VsLocusCheckHorizon, VsMuzzleRangeCircle, VsMuzzleRangeUp, VsDeConAndTimeOld;
          @property (assign) struct PunishThreshold VsBulletDirFailed, VsBoneScale, VsHitBoneNameNone, VsHitBoneHitMissMatch;
          @property (assign) struct PunishThreshold VsBulletID, VsVehicleTimeStampError, VsWatchTimeStampError, VsBoneInfo;
          @property (assign) struct PunishThreshold VsJumpMaxHeight, VsJumpMaxHeight15, VsJumpMaxHeight2, VsShootRpgShootTimeVerify;
          @property (assign) struct PunishThreshold SpeedQuickCheck, BulletDirError;
          @end

          /* ==========================================
             🦅 FALCON CORE ENGINE - C2 & UI SYSTEM
             ========================================== */
          void FetchDataFromServer(void);
          void SaveLicenseKey(NSString* key);
          NSString* GetSavedLicenseKey(void);
          uintptr_t GetBase(const char* name);
          void Patch(uintptr_t addr, std::vector<uint8_t> data);
          void ProcessCryzerHooks(void);

          NSString *apiUrlBase = @"http://34.204.178.160/api.php";

          // ==========================================
          // 🔒 شاشة القفل وتجميد اللعبة (Force Lock)
          // ==========================================
          @interface FalconAuthViewController : UIViewController <WKScriptMessageHandler>
          @property (nonatomic, strong) WKWebView *webView;
          @end

          @implementation FalconAuthViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              
              // خلفية سوداء تعزل اللعبة تماماً
              self.view.backgroundColor = [UIColor colorWithWhite:0 alpha:0.85];
              
              WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
              [config.userContentController addScriptMessageHandler:self name:@"falconAuth"];
              
              self.webView = [[WKWebView alloc] initWithFrame:self.view.bounds configuration:config];
              self.webView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              self.webView.backgroundColor = [UIColor clearColor];
              self.webView.opaque = NO;
              
              // 🚫 منع تحريك الشاشة (Scrolling) أو الزوم
              self.webView.scrollView.scrollEnabled = NO;
              self.webView.scrollView.bounces = NO;
              self.webView.scrollView.pinchGestureRecognizer.enabled = NO;
              
              [self.view addSubview:self.webView];
              
              NSString *html = @"<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'><script src='https://cdn.tailwindcss.com'></script><style>body { background: transparent; margin: 0; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; touch-action: none; user-select: none; } .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 25px; display: flex; flex-direction: row; align-items: center; gap: 20px; width: 480px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }</style></head><body><div class='glass'><div class='flex-1 text-right'><h1 class='text-4xl font-black text-white italic tracking-tighter'>FALCON</h1><h2 class='text-2xl font-black text-blue-500 italic tracking-tighter'>EYE</h2><p class='text-[9px] text-gray-500 uppercase tracking-widest font-bold mt-2'>Dynamic Security</p></div><div class='flex-[2] flex flex-col gap-3'><div class='relative'><input type='text' id='k' placeholder='أدخل مفتاح التفعيل' class='w-full bg-black/60 border border-white/10 rounded-xl p-3.5 text-white text-center outline-none focus:border-blue-500 transition-all font-mono font-bold text-sm tracking-widest'><button onclick='pasteKey()' class='absolute left-2 top-1/2 -translate-y-1/2 bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg text-[10px] text-blue-400 font-bold uppercase tracking-wider transition-all'>لصق</button></div><button onclick='activate()' id='btn' class='w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3.5 rounded-xl shadow-lg active:scale-95 transition-all text-sm uppercase tracking-widest'>دخول للنظام</button><div id='msg' class='text-xs font-bold hidden text-center mt-1'></div></div></div><script>function pasteKey(){ window.webkit.messageHandlers.falconAuth.postMessage({action:'paste'}); } function setKey(val){ document.getElementById('k').value = val; } function activate(){ var code = document.getElementById('k').value.trim(); if(!code) return; document.getElementById('btn').disabled=true; document.getElementById('btn').style.opacity='0.5'; document.getElementById('msg').innerHTML='جاري المصادقة...'; document.getElementById('msg').className='text-blue-400 block animate-pulse'; window.webkit.messageHandlers.falconAuth.postMessage({action:'auth', code: code}); } function showResult(isSuccess, message){ document.getElementById('btn').disabled=false; document.getElementById('btn').style.opacity='1'; document.getElementById('msg').innerHTML=message; document.getElementById('msg').className = isSuccess ? 'text-green-400 block' : 'text-red-500 block'; }</script></body></html>";
              
              [self.webView loadHTMLString:html baseURL:nil];
          }

          // قفل اتجاه الشاشة بالعرض فقط
          - (UIInterfaceOrientationMask)supportedInterfaceOrientations {
              return UIInterfaceOrientationMaskLandscape;
          }

          - (void)userContentController:(WKUserContentController *)userContentController didReceiveScriptMessage:(WKScriptMessage *)message {
              NSDictionary *data = (NSDictionary *)message.body;
              
              if ([data[@"action"] isEqualToString:@"paste"]) {
                  NSString *p = [UIPasteboard generalPasteboard].string;
                  // فلترة المسافات عند اللصق
                  if (p) {
                      p = [p stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
                      [self.webView evaluateJavaScript:[NSString stringWithFormat:@"setKey('%@')", p] completionHandler:nil];
                  }
              } else if ([data[@"action"] isEqualToString:@"auth"]) {
                  // تنظيف الكود من أي مسافات مخفية تسبب خطأ بالسيرفر
                  NSString *c = [data[@"code"] stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
                  NSString *u = [[UIDevice currentDevice] identifierForVendor].UUIDString;
                  
                  // 🔗 تشفير الرابط لضمان عدم وجود أخطاء في الـ HTTP
                  NSString *rawUrl = [NSString stringWithFormat:@"%@?action=auth&code=%@&udid=%@", apiUrlBase, c, u];
                  NSString *encodedUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
                  
                  [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encodedUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                      dispatch_async(dispatch_get_main_queue(), ^{
                          if (e || !d) { [self.webView evaluateJavaScript:@"showResult(false, '❌ خطأ بالاتصال بالسيرفر')" completionHandler:nil]; return; }
                          NSDictionary *json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                          if ([json[@"status"] isEqualToString:@"success"]) {
                              SaveLicenseKey(c);
                              [self.webView evaluateJavaScript:@"showResult(true, '✅ تم التفعيل، جاري فتح اللعبة...')" completionHandler:nil];
                              
                              // إغلاق شاشة القفل والبدء بالعمل
                              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.5 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                                  [self dismissViewControllerAnimated:YES completion:^{
                                      FetchDataFromServer();
                                  }];
                              });
                          } else {
                              NSString *errMsg = json[@"message"] ?: @"❌ الكود غير صحيح أو مرتبط بجهاز آخر";
                              [self.webView evaluateJavaScript:[NSString stringWithFormat:@"showResult(false, '%@')", errMsg] completionHandler:nil];
                          }
                      });
                  }] resume];
              }
          }
          @end

          @interface FalconUI : NSObject
          + (void)showAuthScreen;
          @end

          @implementation FalconUI
          + (void)showAuthScreen {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIWindow *window = nil;
                  if (@available(iOS 13.0, *)) {
                      for (UIWindowScene* scene in [UIApplication sharedApplication].connectedScenes) {
                          if (scene.activationState == UISceneActivationStateForegroundActive) {
                              window = scene.windows.firstObject; break;
                          }
                      }
                  }
                  if (!window) window = [UIApplication sharedApplication].keyWindow;
                  
                  if (window.rootViewController) {
                      FalconAuthViewController *authVC = [[FalconAuthViewController alloc] init];
                      authVC.modalPresentationStyle = UIModalPresentationOverFullScreen; // تغطية الشاشة بالكامل
                      [window.rootViewController presentViewController:authVC animated:YES completion:nil];
                  }
              });
          }
          @end

          /* ==========================================
             🚀 CRYZER HOOKS - تزييف معلومات الأنتي شيت
             ========================================== */
          void DisableAntiCheatForCryzer(ASTExtraBaseCharacter* c) {
              c.bRecordKillData = NO; c.IsEnableReportRoute = NO; c.IsEnableLogAIPlayerPos = NO;
              c.IsEnableReportPlayerKillFlow = NO; c.IsEnableReportGameSetting = NO;
              c.EnableReportGameSettingLevel = 0; c.IsEnableReportMrpcsInCircleFlow = NO;
              c.IsEnableReportMrpcsInPartCircleFlow = NO; c.IsEnableReportMrpcsFlow = NO;
              c.bDetectingPaintDecalTarget = NO; c.EnableReverseVerityBlock = NO;
          }

          void ProcessCryzerHooks() {
              NSLog(@"[Falcon] 🛡️ Cryzer AntiBan: Spoofing Active.");
          }

          /* ==========================================
             🛰️ FETCH DATA & SCHEDULED PATCHING
             ========================================== */
          void FetchDataFromServer() {
              NSString *code = GetSavedLicenseKey();
              NSString *udid = [[UIDevice currentDevice] identifierForVendor].UUIDString;
              
              NSString *rawUrl = [NSString stringWithFormat:@"%@?action=get_offsets&code=%@&udid=%@", apiUrlBase, code, udid];
              NSString *encodedUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
              
              [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encodedUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (d) {
                      NSDictionary *oj = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                      if (oj[@"payload"]) {
                          NSData *decoded = [[NSData alloc] initWithBase64EncodedString:oj[@"payload"] options:0];
                          NSArray *list = [NSJSONSerialization JSONObjectWithData:decoded options:0 error:nil];
                          
                          // 🎯 قنص الجاسوس 0x4b2d3d0 بعد 40 ثانية بالضبط من التفعيل
                          dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 40 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                              uintptr_t baseShadow = GetBase("ShadowTrackerExtra");
                              if (baseShadow > 0) {
                                  Patch(baseShadow + 0x4b2d3d0, {0x1F, 0x20, 0x03, 0xD5});
                                  NSLog(@"[Falcon] 🛡️ Target 0x4b2d3d0 disabled (NOP) after 40s.");
                              }
                          });

                          if (list) {
                              for (NSDictionary *item in list) {
                                  NSString *target = item[@"target_module"];
                                  uintptr_t base = GetBase([target UTF8String]);
                                  
                                  if (base > 0) {
                                      uintptr_t off = strtoull([item[@"offset_hex"] UTF8String], NULL, 16);
                                      Patch(base + off, {0xC0, 0x03, 0x5F, 0xD6}); // حقن RET
                                      
                                      NSString *repRaw = [NSString stringWithFormat:@"%@?action=mark_injected&hex=%@&code=%@&udid=%@", apiUrlBase, item[@"offset_hex"], code, udid];
                                      NSString *repEnc = [repRaw stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
                                      [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:repEnc]] resume];
                                  }
                              }
                          }
                          ProcessCryzerHooks();
                      }
                  }
              }] resume];
          }

          uintptr_t GetBase(const char* name) {
              uint32_t count = _dyld_image_count();
              for (uint32_t i = 0; i < count; i++) {
                  const char* img_name = _dyld_get_image_name(i);
                  if (img_name && strstr(img_name, name)) return _dyld_get_image_vmaddr_slide(i) + 0x100000000;
              }
              return 0;
          }

          void Patch(uintptr_t addr, std::vector<uint8_t> data) {
              mach_port_t t = mach_task_self();
              vm_protect(t, addr, data.size(), FALSE, VM_PROT_READ | VM_PROT_WRITE | VM_PROT_COPY);
              vm_write(t, addr, (vm_offset_t)data.data(), (mach_msg_type_number_t)data.size());
              vm_protect(t, addr, data.size(), FALSE, VM_PROT_READ | VM_PROT_EXECUTE);
          }

          void SaveLicenseKey(NSString* key) { [[NSUserDefaults standardUserDefaults] setObject:key forKey:@"FalconEyeKey"]; }
          NSString* GetSavedLicenseKey() { return [[NSUserDefaults standardUserDefaults] stringForKey:@"FalconEyeKey"]; }

          void AutoLoginCheck() {
              NSString *k = GetSavedLicenseKey();
              if (k && k.length > 0) {
                  NSString *u = [[UIDevice currentDevice] identifierForVendor].UUIDString;
                  NSString *rawUrl = [NSString stringWithFormat:@"%@?action=auth&code=%@&udid=%@", apiUrlBase, k, u];
                  NSString *encodedUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
                  
                  [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encodedUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                      if (d && !e) {
                          NSDictionary *j = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                          if ([j[@"status"] isEqualToString:@"success"]) { FetchDataFromServer(); return; }
                      }
                      [FalconUI showAuthScreen];
                  }] resume];
              } else {
                  [FalconUI showAuthScreen];
              }
          }

          __attribute__((constructor)) static void init() {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 5 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  AutoLoginCheck();
              });
          }
          EOF

      - name: Build Framework Payload
        run: |
          clang++ -dynamiclib -arch arm64 -x objective-c++ -std=c++17 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -framework Foundation -framework UIKit -framework WebKit \
          -framework QuartzCore -framework CoreGraphics \
          FalconEye.mm -o FalconEye.dylib
          if [ -f FalconEye.dylib ]; then
            strip -x FalconEye.dylib
          fi

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-Ultimate-Engine
          path: FalconEye.dylib
