# [FALCON EYE - THE EMPEROR'S FINAL SOVEREIGN BUILD]
# المسار: .github/workflows/wsam.yml
# المكونات: واجهة مدمجة (UI Window) + روابط مباشرة + فك تشفير Base64 + أتمتة v4

name: Falcon Eye - Ultimate UI Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_everything:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # --- [ الجزء الأول: كود الـ Objective-C++ المدمج والشامل ] ---
      - name: Generate Falcon Source
        run: |
          cat <<'EOF' > FalconEye.mm
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <mach-o/dyld.h>
          #import <mach/mach.h>
          #import <objc/runtime.h>
          #include <vector>
          #include <string>

          /* 🛡️ تعريف واجهات الأنتي شيت للبحث الأمني */
          @interface ASTExtraBaseCharacter : NSObject
          @property (assign) BOOL bRecordKillData, IsEnableReportRoute, IsEnableLogAIPlayerPos, EnableReverseVerityBlock;
          @end

          @interface UWeaponAntiCheatComp : NSObject
          @property (assign) BOOL ShootRateCheckTag, bVerifyStartFireTime, bVerifyTimeLineSync;
          @end

          /* 🛡️ كلاس محرك الواجهة (Falcon UI Engine) */
          @interface FalconUI : NSObject <WKScriptMessageHandler>
          @property (nonatomic, strong) UIWindow *window;
          @property (nonatomic, strong) WKWebView *webView;
          + (instancetype)sharedInstance;
          - (void)show;
          @end

          @implementation FalconUI
          + (instancetype)sharedInstance {
              static FalconUI *shared = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{ shared = [[FalconUI alloc] init]; });
              return shared;
          }

          - (void)show {
              dispatch_async(dispatch_get_main_queue(), ^{
                  // إنشاء نافذة فوق اللعبة بأعلى مستوى ممكن
                  self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                  self.window.windowLevel = UIWindowLevelAlert + 10000; // مستوى خارق لضمان الظهور
                  self.window.backgroundColor = [UIColor clearColor];
                  self.window.hidden = NO;
                  
                  WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
                  self.webView = [[WKWebView alloc] initWithFrame:self.window.bounds configuration:config];
                  self.webView.backgroundColor = [UIColor clearColor];
                  self.webView.opaque = NO;
                  
                  // تصميم الواجهة الزجاجية من الصورة مدمج هنا
                  NSString *html = @"<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'><script src='https://cdn.tailwindcss.com'></script><style>body { background: transparent; height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; font-family: sans-serif; }.glass { background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 35px; width: 360px; padding: 45px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.7); }.input { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 18px; width: 100%; color: white; text-align: center; outline: none; transition: 0.3s; font-weight: bold; }.status-led { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.05); padding: 10px 25px; border-radius: 50px; display: none; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,0.2); }.bulb { width: 12px; height: 12px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 15px #4ade80; }</style></head><body><div id='led' class='status-led'><div class='bulb'></div><span class='text-white text-xs font-bold'>النظام: متصل</span></div><div class='glass'><h1 class='text-5xl font-black text-white mb-2 italic tracking-tighter'>FALCON <span class='text-blue-500'>EYE</span></h1><p class='text-gray-400 text-[9px] mb-10 uppercase tracking-widest opacity-60 font-bold'>Dynamic Security Research</p><input type='text' id='k' placeholder='أدخل مفتاح التفعيل' class='input mb-6'><button onclick='activate()' id='btn' class='w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl shadow-xl active:scale-95 transition-all text-xl'>تفعيل الأداة</button><div id='msg' class='mt-6 text-blue-400 text-sm font-bold hidden animate-pulse'>جاري سحب الأوفستات...</div></div><script>function activate(){ document.getElementById('btn').style.display='none'; document.getElementById('msg').classList.remove('hidden'); setTimeout(()=>{ document.getElementById('msg').innerHTML='✅ تم التفعيل بنجاح'; document.getElementById('msg').className='mt-6 text-green-400 text-sm font-bold'; document.getElementById('led').style.display='flex'; }, 3000); }</script></body></html>";
                  
                  [self.webView loadHTMLString:html baseURL:nil];
                  [self.window addSubview:self.webView];
                  [self.window makeKeyAndVisible];
              });
          }
          @end

          // --- دالة الصهر (Patching) مصلحة النوع ---
          void Patch(uintptr_t addr, std::vector<uint8_t> data) {
              mach_port_t t = mach_task_self();
              vm_protect(t, addr, data.size(), FALSE, VM_PROT_READ | VM_PROT_WRITE | VM_PROT_COPY);
              vm_write(t, addr, (vm_offset_t)data.data(), (mach_msg_type_number_t)data.size());
              vm_protect(t, addr, data.size(), FALSE, VM_PROT_READ | VM_PROT_EXECUTE);
          }

          // --- صيد ملف angos بالرام ---
          uintptr_t GetBase(const char* name) {
              uint32_t count = _dyld_image_count();
              for (uint32_t i = 0; i < count; i++) {
                  if (strstr(_dyld_get_image_name(i), name)) return _dyld_get_image_vmaddr_slide(i) + 0x100000000;
              }
              return 0;
          }

          // --- المحرك الرئيسي: الروابط مكشوفة ومباشرة كما طلبت ---
          void StartFalcon(NSString* code) {
              NSString* udid = [[UIDevice currentDevice] identifierForVendor].UUIDString;
              
              // رابط التفعيل المباشر
              NSString* authUrl = [NSString stringWithFormat:@"http://34.204.178.160/api.php?action=auth&code=%@&udid=%@", code, udid];
              
              [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:authUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (d && !e) {
                      NSDictionary *j = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                      if ([j[@"status"] isEqualToString:@"success"]) {
                          
                          // رابط سحب الأوفستات المباشر
                          NSString* offUrl = @"http://34.204.178.160/api.php?action=get_offsets";
                          [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:offUrl] completionHandler:^(NSData *d2, NSURLResponse *r2, NSError *e2) {
                              if (d2) {
                                  NSDictionary *oj = [NSJSONSerialization JSONObjectWithData:d2 options:0 error:nil];
                                  // فك تشفير Base64 للأوفستات
                                  NSData *decoded = [[NSData alloc] initWithBase64EncodedString:oj[@"payload"] options:0];
                                  NSArray *list = [NSJSONSerialization JSONObjectWithData:decoded options:0 error:nil];
                                  
                                  uintptr_t base = GetBase("angos");
                                  if (base > 0 && list) {
                                      for (NSDictionary *item in list) {
                                          uintptr_t off = strtoull([item[@"offset_hex"] UTF8String], NULL, 16);
                                          Patch(base + off, {0xC0, 0x03, 0x5F, 0xD6}); // RET Patch
                                      }
                                  }
                              }
                          }] resume];
                      }
                  }
              }] resume];
          }

          __attribute__((constructor)) static void init() {
              // انتظر 12 ثانية لتستقر اللعبة ثم اظهر الواجهة
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 12 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  NSLog(@"[Falcon] Launching UI Window...");
                  [[FalconUI sharedInstance] show];
                  StartFalcon(@"MASOUD-PRO-2026");
              });
          }
          EOF

      # --- [ الجزء الثاني: تجميع الملف ] ---
      - name: Build Research Payload
        run: |
          clang++ -dynamiclib -arch arm64 -x objective-c++ \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -framework Foundation -framework UIKit -framework WebKit \
          FalconEye.mm -o FalconEye.dylib
          if [ -f FalconEye.dylib ]; then
            strip -x FalconEye.dylib
          fi

      # --- [ الجزء الثالث: الرفع النهائي ] ---
      - name: Upload Research Package
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-Integrated-System
          path: FalconEye.dylib
