name: Falcon Eye - Ultimate Integrated Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_everything:
    runs-on: macos-latest
    # 🔥 لحل مشكلة تحذير Node.js في GitHub
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Falcon Source
        run: |
          cat <<'EOF' > FalconEye.mm
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <mach-o/dyld.h>
          #import <mach/mach.h>
          #include <vector>
          #include <map>
          #include <string>

          /* ==========================================
             🛡️ CRYZER ANTI-CHEAT STRUCTURES (C++ Structs)
             تم تحويلها لـ C++ لضمان نجاح التجميع واستخراج الدايلب
             ========================================== */
          struct ASTExtraBaseCharacter {
              bool bRecordKillData, IsEnableReportRoute, IsEnableLogAIPlayerPos, IsEnableReportPlayerKillFlow;
              bool IsEnableReportGameSetting, EnableReverseVerityBlock, bDetectingPaintDecalTarget;
              bool IsEnableReportMrpcsInCircleFlow, IsEnableReportMrpcsInPartCircleFlow, IsEnableReportMrpcsFlow;
              int EnableReportGameSettingLevel;
          };

          struct UWeaponAntiCheatComp {
              float ShootRateCheckInterval, ShootRateCheckMulCoff, ShootTimeInfoCheckClearInterval, ShootTimeInfoCheckLifeTime;
              float TimeLineCheckDnBorder, TimeLineCheckUpBorder;
              bool ShootRateCheckTag, bVerifyStartFireTime, bVerifyTimeLineSync;
          };

          struct USTExtraShootWeaponComponent {
              bool bSkipVerifyShootIDValidity, bSkipVerifyStartFire;
          };

          struct PunishThreshold { int PunishThresHold; bool bShouldPunish; };
          
          struct UPlayerAntiCheatManager {
              struct PunishThreshold CheatStateData2TotalCheatTimes, MoveCheatAntiStrategy3TotalCheatTimes, VsNoHitDetail;
              struct PunishThreshold VsLocusCheckHorizon, VsMuzzleRangeCircle, VsMuzzleRangeUp, VsDeConAndTimeOld;
              struct PunishThreshold VsBulletDirFailed, VsBoneScale, VsHitBoneNameNone, VsHitBoneHitMissMatch;
              struct PunishThreshold VsBulletID, VsVehicleTimeStampError, VsWatchTimeStampError, VsBoneInfo;
              struct PunishThreshold VsJumpMaxHeight, VsJumpMaxHeight15, VsJumpMaxHeight2, VsShootRpgShootTimeVerify;
              struct PunishThreshold SpeedQuickCheck, BulletDirError;
          };

          /* ==========================================
             🦅 FALCON CORE ENGINE
             ========================================== */
          void FetchDataFromServer(void);
          void SaveLicenseKey(NSString* key);
          NSString* GetSavedLicenseKey(void);
          uintptr_t GetBase(const char* name);
          void Patch(uintptr_t addr, std::vector<uint8_t> data);
          void ProcessCryzerHooks(void);
          void SafeInjectLoop(NSArray *offsetsList);

          NSString *apiUrlBase = @"http://34.204.178.160/api.php";

          // ==========================================
          // 🕹️ شريط الحالة الصغير والثابت (Native Text HUD)
          // ==========================================
          @interface FalconHUD : NSObject
          @property (nonatomic, strong) UIWindow *hudWindow;
          @property (nonatomic, strong) UILabel *statusLabel;
          + (instancetype)sharedInstance;
          - (void)showHUD;
          - (void)updateStatus:(NSString *)status color:(UIColor *)color;
          @end

          @implementation FalconHUD
          + (instancetype)sharedInstance {
              static FalconHUD *shared = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{ shared = [[FalconHUD alloc] init]; });
              return shared;
          }

          - (void)showHUD {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (self.hudWindow) return;
                  
                  CGFloat screenWidth = [UIScreen mainScreen].bounds.size.width;
                  self.hudWindow = [[UIWindow alloc] initWithFrame:CGRectMake(0, 10, screenWidth, 20)];
                  self.hudWindow.windowLevel = UIWindowLevelStatusBar + 100;
                  self.hudWindow.backgroundColor = [UIColor clearColor];
                  self.hudWindow.userInteractionEnabled = NO; 
                  
                  self.statusLabel = [[UILabel alloc] initWithFrame:self.hudWindow.bounds];
                  self.statusLabel.textAlignment = NSTextAlignmentCenter;
                  self.statusLabel.font = [UIFont boldSystemFontOfSize:10];
                  self.statusLabel.textColor = [UIColor greenColor];
                  self.statusLabel.layer.shadowColor = [UIColor blackColor].CGColor;
                  self.statusLabel.layer.shadowOffset = CGSizeMake(1, 1);
                  self.statusLabel.layer.shadowOpacity = 1.0;
                  self.statusLabel.layer.shadowRadius = 2.0;
                  
                  self.statusLabel.text = @"🟢 System Connected | 🛡️ Secure | 🚀 Falcon VPS";
                  
                  [self.hudWindow addSubview:self.statusLabel];
                  [self.hudWindow makeKeyAndVisible];
              });
          }

          - (void)updateStatus:(NSString *)status color:(UIColor *)color {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (self.statusLabel) {
                      self.statusLabel.text = status;
                      self.statusLabel.textColor = color;
                  }
              });
          }
          @end

          // ==========================================
          // 🔒 شاشة القفل وتجميد اللعبة (Pitch Black)
          // ==========================================
          @interface FalconAuthViewController : UIViewController <WKScriptMessageHandler>
          @property (nonatomic, strong) WKWebView *webView;
          @end

          @implementation FalconAuthViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              
              self.view.backgroundColor = [UIColor blackColor];
              
              WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
              [config.userContentController addScriptMessageHandler:self name:@"falconAuth"];
              
              self.webView = [[WKWebView alloc] initWithFrame:self.view.bounds configuration:config];
              self.webView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              self.webView.backgroundColor = [UIColor clearColor];
              self.webView.opaque = NO;
              
              self.webView.scrollView.scrollEnabled = NO;
              self.webView.scrollView.bounces = NO;
              self.webView.scrollView.pinchGestureRecognizer.enabled = NO;
              
              [self.view addSubview:self.webView];
              
              NSString *html = @"<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><script src='https://cdn.tailwindcss.com'></script><style>body { background: transparent; margin: 0; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; touch-action: none; user-select: none; } .glass { background: rgba(15, 23, 42, 1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 20px; padding: 25px; display: flex; flex-direction: row; align-items: center; gap: 20px; width: 480px; box-shadow: 0 0 50px rgba(0,0,0,0.9); }</style></head><body><div class='glass'><div class='flex-1 text-right'><h1 class='text-4xl font-black text-white italic tracking-tighter'>FALCON</h1><h2 class='text-2xl font-black text-blue-500 italic tracking-tighter'>EYE</h2><p class='text-[9px] text-gray-500 uppercase tracking-widest font-bold mt-2'>Game Locked 🔒</p></div><div class='flex-[2] flex flex-col gap-3'><div class='relative'><input type='text' id='k' placeholder='أدخل مفتاح التفعيل' class='w-full bg-[#020617] border border-blue-500/20 rounded-xl p-3.5 text-white text-center outline-none focus:border-blue-500 transition-all font-mono font-bold text-sm tracking-widest'><button onclick='pasteKey()' class='absolute left-2 top-1/2 -translate-y-1/2 bg-blue-600/20 hover:bg-blue-600/40 px-3 py-1.5 rounded-lg text-[10px] text-blue-400 font-bold uppercase tracking-wider transition-all'>لصق</button></div><button onclick='activate()' id='btn' class='w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3.5 rounded-xl shadow-lg active:scale-95 transition-all text-sm uppercase tracking-widest'>فك التجميد والدخول</button><div id='msg' class='text-xs font-bold hidden text-center mt-1'></div></div></div><script>function pasteKey(){ window.webkit.messageHandlers.falconAuth.postMessage({action:'paste'}); } function setKey(val){ document.getElementById('k').value = val; } function activate(){ var code = document.getElementById('k').value.trim(); if(!code) return; document.getElementById('btn').disabled=true; document.getElementById('btn').style.opacity='0.5'; document.getElementById('msg').innerHTML='جاري المصادقة الآمنة...'; document.getElementById('msg').className='text-blue-400 block animate-pulse'; window.webkit.messageHandlers.falconAuth.postMessage({action:'auth', code: code}); } function showResult(isSuccess, message){ document.getElementById('btn').disabled=false; document.getElementById('btn').style.opacity='1'; document.getElementById('msg').innerHTML=message; document.getElementById('msg').className = isSuccess ? 'text-green-400 block' : 'text-red-500 block'; }</script></body></html>";
              
              [self.webView loadHTMLString:html baseURL:nil];
          }

          - (UIInterfaceOrientationMask)supportedInterfaceOrientations { return UIInterfaceOrientationMaskLandscape; }

          - (void)userContentController:(WKUserContentController *)userContentController didReceiveScriptMessage:(WKScriptMessage *)message {
              NSDictionary *data = (NSDictionary *)message.body;
              
              if ([data[@"action"] isEqualToString:@"paste"]) {
                  NSString *p = [UIPasteboard generalPasteboard].string;
                  if (p) {
                      p = [p stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
                      [self.webView evaluateJavaScript:[NSString stringWithFormat:@"setKey('%@')", p] completionHandler:nil];
                  }
              } else if ([data[@"action"] isEqualToString:@"auth"]) {
                  NSString *c = [data[@"code"] stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
                  NSString *u = [[UIDevice currentDevice] identifierForVendor].UUIDString;
                  
                  NSString *rawUrl = [NSString stringWithFormat:@"%@?action=auth&code=%@&udid=%@", apiUrlBase, c, u];
                  NSString *encodedUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
                  
                  [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encodedUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                      dispatch_async(dispatch_get_main_queue(), ^{
                          if (e || !d) { [self.webView evaluateJavaScript:@"showResult(false, '❌ خطأ بالاتصال بالسيرفر')" completionHandler:nil]; return; }
                          NSDictionary *json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                          if ([json[@"status"] isEqualToString:@"success"]) {
                              SaveLicenseKey(c);
                              [self.webView evaluateJavaScript:@"showResult(true, '✅ تم التفعيل، جاري إطلاق اللعبة...')" completionHandler:nil];
                              
                              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                                  [self dismissViewControllerAnimated:YES completion:^{
                                      FetchDataFromServer();
                                  }];
                              });
                          } else {
                              NSString *errMsg = json[@"message"] ?: @"❌ الكود غير صحيح أو مرتبط بجهاز آخر";
                              [self.webView evaluateJavaScript:[NSString stringWithFormat:@"showResult(false, '%@')", errMsg] completionHandler:nil];
                          }
                      });
                  }] resume];
              }
          }
          @end

          @interface FalconUI : NSObject
          + (void)showAuthScreen;
          @end

          @implementation FalconUI
          + (void)showAuthScreen {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIWindow *window = nil;
                  if (@available(iOS 13.0, *)) {
                      for (UIWindowScene* scene in [UIApplication sharedApplication].connectedScenes) {
                          if (scene.activationState == UISceneActivationStateForegroundActive) { window = scene.windows.firstObject; break; }
                      }
                  }
                  if (!window) window = [UIApplication sharedApplication].keyWindow;
                  
                  if (window.rootViewController) {
                      FalconAuthViewController *authVC = [[FalconAuthViewController alloc] init];
                      authVC.modalPresentationStyle = UIModalPresentationOverFullScreen;
                      [window.rootViewController presentViewController:authVC animated:NO completion:nil];
                  }
              });
          }
          @end

          /* ==========================================
             🚀 CRYZER HOOKS - تزييف معلومات الأنتي شيت
             ========================================== */
          void DisableAntiCheatForCryzer(ASTExtraBaseCharacter* c) {
              if(!c) return;
              c->bRecordKillData = false; c->IsEnableReportRoute = false; c->IsEnableLogAIPlayerPos = false;
              c->IsEnableReportPlayerKillFlow = false; c->IsEnableReportGameSetting = false;
              c->EnableReportGameSettingLevel = 0; c->IsEnableReportMrpcsInCircleFlow = false;
              c->IsEnableReportMrpcsInPartCircleFlow = false; c->IsEnableReportMrpcsFlow = false;
              c->bDetectingPaintDecalTarget = false; c->EnableReverseVerityBlock = false;
          }

          void ProcessCryzerHooks() {
              NSLog(@"[Falcon] 🛡️ Cryzer AntiBan: Spoofing Active.");
          }

          /* ==========================================
             🛰️ نظام الانتظار الذكي (Safe Injection)
             ========================================== */
          void SafeInjectLoop(NSArray *offsetsList) {
              static int attempts = 0;
              if (attempts > 50) {
                  [[FalconHUD sharedInstance] updateStatus:@"⚠️ خطأ: لم يتم العثور على ملفات اللعبة" color:[UIColor redColor]];
                  return; 
              }
              
              BOOL allInjected = YES;
              
              for (NSDictionary *item in offsetsList) {
                  NSString *target = item[@"target_module"];
                  uintptr_t base = GetBase([target UTF8String]);
                  
                  if (base > 0) {
                      uintptr_t off = strtoull([item[@"offset_hex"] UTF8String], NULL, 16);
                      Patch(base + off, {0xC0, 0x03, 0x5F, 0xD6});
                      
                      NSString *rawUrl = [NSString stringWithFormat:@"%@?action=mark_injected&hex=%@&code=%@&udid=%@", apiUrlBase, item[@"offset_hex"], GetSavedLicenseKey(), [[UIDevice currentDevice] identifierForVendor].UUIDString];
                      NSString *encUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
                      [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encUrl]] resume];
                  } else {
                      allInjected = NO;
                  }
              }
              
              if (!allInjected) {
                  attempts++;
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                      SafeInjectLoop(offsetsList);
                  });
              } else {
                  [[FalconHUD sharedInstance] updateStatus:@"🟢 تم الحقن بنجاح | 🛡️ وضع الأمان الفعال" color:[UIColor greenColor]];
                  ProcessCryzerHooks();
              }
          }

          void FetchDataFromServer() {
              NSString *code = GetSavedLicenseKey();
              NSString *udid = [[UIDevice currentDevice] identifierForVendor].UUIDString;
              
              NSString *rawUrl = [NSString stringWithFormat:@"%@?action=get_offsets&code=%@&udid=%@", apiUrlBase, code, udid];
              NSString *encodedUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
              
              [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encodedUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (d) {
                      NSDictionary *oj = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                      if (oj[@"payload"]) {
                          NSData *decoded = [[NSData alloc] initWithBase64EncodedString:oj[@"payload"] options:0];
                          NSArray *list = [NSJSONSerialization JSONObjectWithData:decoded options:0 error:nil];
                          
                          [[FalconHUD sharedInstance] showHUD];
                          [[FalconHUD sharedInstance] updateStatus:@"🟡 جاري انتظار ملفات اللعبة للحقن..." color:[UIColor yellowColor]];
                          
                          // 🎯 قنص الجاسوس 0x4b2d3d0 بعد 40 ثانية بالضبط
                          dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 40 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                              uintptr_t baseShadow = GetBase("ShadowTrackerExtra");
                              if (baseShadow > 0) {
                                  Patch(baseShadow + 0x4b2d3d0, {0x1F, 0x20, 0x03, 0xD5});
                                  NSLog(@"[Falcon] 🛡️ Target 0x4b2d3d0 disabled (NOP) after 40s.");
                              }
                          });

                          if (list) {
                              SafeInjectLoop(list);
                          }
                      }
                  }
              }] resume];
          }

          uintptr_t GetBase(const char* name) {
              uint32_t count = _dyld_image_count();
              for (uint32_t i = 0; i < count; i++) {
                  const char* img_name = _dyld_get_image_name(i);
                  if (img_name && strstr(img_name, name)) return _dyld_get_image_vmaddr_slide(i) + 0x100000000;
              }
              return 0;
          }

          void Patch(uintptr_t addr, std::vector<uint8_t> data) {
              mach_port_t t = mach_task_self();
              vm_protect(t, addr, data.size(), FALSE, VM_PROT_READ | VM_PROT_WRITE | VM_PROT_COPY);
              vm_write(t, addr, (vm_offset_t)data.data(), (mach_msg_type_number_t)data.size());
              vm_protect(t, addr, data.size(), FALSE, VM_PROT_READ | VM_PROT_EXECUTE);
          }

          void SaveLicenseKey(NSString* key) { [[NSUserDefaults standardUserDefaults] setObject:key forKey:@"FalconEyeKe
