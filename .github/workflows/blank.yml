name: Masoud Ultimate Mod Menu

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos & SDKs
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Create Project Structure
        run: |
          mkdir -p bypass_project
          cd bypass_project
          
          # تحميل مكتبة fishhook للهوكين
          curl -sO https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h
          curl -sO https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c
          
          # إنشاء Makefile
          cat << 'EOF' > Makefile
          ARCHS = arm64
          TARGET = iphone:clang:latest:14.0
          SYSROOT = $(THEOS)/sdks/iPhoneOS14.5.sdk
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = ShadowBypass
          ShadowBypass_FILES = Tweak.xm fishhook.c
          ShadowBypass_CFLAGS = -fobjc-arc
          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF
          
          # إنشاء Plist
          cat << 'EOF' > ShadowBypass.plist
          { Filter = { Bundles = ( "com.tencent.ig" ); }; }
          EOF

          # كود الـ Tweak.xm مع المنيو المتطور
          cat << 'EOF' > Tweak.xm
          #import <Foundation/Foundation.h>
          #import <mach-o/dyld.h>
          #import <sys/mman.h>
          #import <dlfcn.h>
          #import <UIKit/UIKit.h>
          #import "fishhook.h"

          // --- نظام التشفير XOR للأوفستات ---
          #define KEY 0xDEADC0DE12345678ULL
          uintptr_t d(uint64_t v) { return (uintptr_t)(v ^ KEY); }

          // الأوفستات المشفرة
          #define E1 0xDEADC0DE14BBAB58ULL // Bypass 1
          #define E2 0xDEADC0DE14BB89B8ULL // Bypass 2
          #define E3 0xDEADC0DE14BBA9C8ULL // Bypass 3
          #define E_FPS 0xDEADC0DE14BAF123ULL // أوفست الـ FPS (كمثال)

          // --- حالات الأزرار ---
          static BOOL s1=NO, s2=NO, s3=NO, sFPS=NO, sLogs=NO;

          // دالة الباتش الآمنة
          void apply_patch(uint64_t enc_off) {
              intptr_t slide = _dyld_get_image_vmaddr_slide(0);
              uintptr_t target = slide + 0x100000000 + d(enc_off);
              size_t psize = sysconf(_SC_PAGESIZE);
              uintptr_t pstart = target & ~(psize - 1);
              if (mprotect((void*)pstart, psize, PROT_READ | PROT_WRITE | PROT_EXEC) == 0) {
                  unsigned char nop[] = {0x1F, 0x20, 0x03, 0xD5};
                  memcpy((void*)target, nop, 4);
                  mprotect((void*)pstart, psize, PROT_READ | PROT_EXEC);
              }
          }

          // مسح اللوجات (Sandbox Friendly)
          void wipe_logs() {
              NSString *path = [NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES) firstObject];
              NSArray *dirs = @[@"ShadowTrackerExtra/Saved/Logs", @"TGPA", @"ProgramLogs"];
              for (NSString *d in dirs) {
                  [[NSFileManager defaultManager] removeItemAtPath:[path stringByAppendingPathComponent:d] error:nil];
              }
          }

          // --- المنيو التفاعلي (UIAlertController) ---
          void show_masoud_mod_menu() {
              UIAlertController *menu = [UIAlertController alertControllerWithTitle:@"🔥 Masoud Ultimate Menu" 
                                          message:@"إصدار الـ Sideload الآمن" 
                                          preferredStyle:UIAlertControllerStyleActionSheet];

              // زر الأوفست 1
              [menu addAction:[UIAlertAction actionWithTitle:(s1 ? @"✅ Offset 1: ACTIVE" : @"🔴 Offset 1: OFF") style:UIAlertActionStyleDefault handler:^(UIAlertAction *a){
                  if(!s1){ apply_patch(E1); s1=YES; } show_masoud_mod_menu();
              }]];

              // زر الأوفست 2
              [menu addAction:[UIAlertAction actionWithTitle:(s2 ? @"✅ Offset 2: ACTIVE" : @"🔴 Offset 2: OFF") style:UIAlertActionStyleDefault handler:^(UIAlertAction *a){
                  if(!s2){ apply_patch(E2); s2=YES; } show_masoud_mod_menu();
              }]];

              // زر الأوفست 3
              [menu addAction:[UIAlertAction actionWithTitle:(s3 ? @"✅ Offset 3: ACTIVE" : @"🔴 Offset 3: OFF") style:UIAlertActionStyleDefault handler:^(UIAlertAction *a){
                  if(!s3){ apply_patch(E3); s3=YES; } show_masoud_mod_menu();
              }]];

              // زر الـ FPS السحري
              [menu addAction:[UIAlertAction actionWithTitle:(sFPS ? @"⚡ 90 FPS: ACTIVE" : @"⚪ Enable 90 FPS") style:UIAlertActionStyleDefault handler:^(UIAlertAction *a){
                  if(!sFPS){ apply_patch(E_FPS); sFPS=YES; } show_masoud_mod_menu();
              }]];

              // زر تنظيف الأثر
              [menu addAction:[UIAlertAction actionWithTitle:(sLogs ? @"🧹 Logs: WIPED" : @"🔘 Wipe Trace Logs") style:UIAlertActionStyleDestructive handler:^(UIAlertAction *a){
                  wipe_logs(); sLogs=YES; show_masoud_mod_menu();
              }]];

              [menu addAction:[UIAlertAction actionWithTitle:@"إغلاق المنيو" style:UIAlertActionStyleCancel handler:nil]];

              // عرض المنيو
              UIViewController *root = [[[[UIApplication sharedApplication] delegate] window] rootViewController];
              if (root) [root presentViewController:menu animated:YES completion:nil];
          }

          __attribute__((constructor)) static void init() {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 25 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  show_masoud_mod_menu();
              });
          }
          EOF

      - name: Build Dylib
        run: |
          cd bypass_project
          make FINALPACKAGE=1

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Masoud-Ultimate-Menu
          path: bypass_project/.theos/obj/*.dylib
