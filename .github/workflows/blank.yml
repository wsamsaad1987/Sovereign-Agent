name: Falcon Eye - Ultimate Integrated Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_everything:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Falcon Source
        run: |
          cat <<'EOF' > FalconEye.mm
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <mach-o/dyld.h>
          #import <mach/mach.h>
          #include <vector>
          #include <map>
          #include <string>

          /* ==========================================
             🛡️ CRYZER ANTI-CHEAT STRUCTURES
             دمج جميع السترنقات المطلوبة للتزييف
             ========================================== */
          @interface ASTExtraBaseCharacter : NSObject
          @property (assign) BOOL bRecordKillData, IsEnableReportRoute, IsEnableLogAIPlayerPos, IsEnableReportPlayerKillFlow;
          @property (assign) BOOL IsEnableReportGameSetting, bDetectingPaintDecalTarget, EnableReverseVerityBlock;
          @property (assign) BOOL IsEnableReportMrpcsInCircleFlow, IsEnableReportMrpcsInPartCircleFlow, IsEnableReportMrpcsFlow;
          @property (assign) int EnableReportGameSettingLevel;
          @end

          @interface UWeaponAntiCheatComp : NSObject
          @property (assign) float ShootRateCheckInterval, ShootRateCheckMulCoff, ShootTimeInfoCheckClearInterval, ShootTimeInfoCheckLifeTime;
          @property (assign) float TimeLineCheckDnBorder, TimeLineCheckUpBorder;
          @property (assign) BOOL ShootRateCheckTag, bVerifyStartFireTime, bVerifyTimeLineSync;
          @end

          @interface USTExtraShootWeaponComponent : NSObject
          @property (assign) BOOL bSkipVerifyShootIDValidity, bSkipVerifyStartFire;
          @end

          struct PunishThreshold { int PunishThresHold; bool bShouldPunish; };
          @interface UPlayerAntiCheatManager : NSObject
          @property (assign) struct PunishThreshold CheatStateData2TotalCheatTimes, MoveCheatAntiStrategy3TotalCheatTimes, VsNoHitDetail;
          @property (assign) struct PunishThreshold VsLocusCheckHorizon, VsMuzzleRangeCircle, VsMuzzleRangeUp, VsDeConAndTimeOld;
          @property (assign) struct PunishThreshold VsBulletDirFailed, VsBoneScale, VsHitBoneNameNone, VsHitBoneHitMissMatch;
          @property (assign) struct PunishThreshold VsBulletID, VsVehicleTimeStampError, VsWatchTimeStampError, VsBoneInfo;
          @property (assign) struct PunishThreshold VsJumpMaxHeight, VsJumpMaxHeight15, VsJumpMaxHeight2, VsShootRpgShootTimeVerify;
          @property (assign) struct PunishThreshold SpeedQuickCheck, BulletDirError;
          @end

          /* ==========================================
             🦅 FALCON CORE ENGINE
             ========================================== */
          void FetchDataFromServer(void);
          void SaveLicenseKey(NSString* key);
          NSString* GetSavedLicenseKey(void);
          uintptr_t GetBase(const char* name);
          void Patch(uintptr_t addr, std::vector<uint8_t> data);
          void ApplyCryzerSpoofing(void);

          NSString *apiUrlBase = @"http://34.204.178.160/api.php";

          @interface FalconUI : NSObject <WKScriptMessageHandler>
          @property (nonatomic, strong) UIWindow *window;
          @property (nonatomic, strong) WKWebView *webView;
          + (instancetype)sharedInstance;
          - (void)show;
          - (void)hide;
          @end

          @implementation FalconUI
          + (instancetype)sharedInstance {
              static FalconUI *shared = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{ shared = [[FalconUI alloc] init]; });
              return shared;
          }

          - (void)show {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (self.window) return; 
                  // 🔒 تجميد اللعبة: نافذة سوداء شفافة تمنع اللمس
                  self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                  self.window.windowLevel = UIWindowLevelAlert + 10000;
                  self.window.backgroundColor = [UIColor colorWithWhite:0 alpha:0.8]; 
                  self.window.userInteractionEnabled = YES;
                  
                  WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
                  [config.userContentController addScriptMessageHandler:self name:@"falconAuth"]; 
                  
                  // 📏 لوكن عرضي صغير (Horizontal Compact UI)
                  CGFloat w = 460; CGFloat h = 170;
                  self.webView = [[WKWebView alloc] initWithFrame:CGRectMake(0, 0, w, h) configuration:config];
                  self.webView.center = self.window.center;
                  self.webView.layer.cornerRadius = 25;
                  self.webView.clipsToBounds = YES;
                  self.webView.backgroundColor = [UIColor clearColor];
                  self.webView.opaque = NO;
                  
                  NSString *html = @"<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><script src='https://cdn.tailwindcss.com'></script><style>body { background: transparent; overflow: hidden; }.glass { background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 25px; padding: 15px; display: flex; flex-direction: row; align-items: center; gap: 20px; height: 150px; }</style></head><body><div class='glass'><div class='flex-1'><h1 class='text-3xl font-black text-white italic tracking-tighter'>FALCON <span class='text-blue-500'>EYE</span></h1><p class='text-[8px] text-gray-500 uppercase tracking-widest font-bold mt-1'>Dynamic Security</p></div><div class='flex-[2] flex flex-col gap-2'><div class='relative'><input type='text' id='k' placeholder='مفتاح التفعيل' class='w-full bg-black/50 border border-white/10 rounded-xl p-2.5 text-white text-center outline-none focus:border-blue-500 transition-all font-bold text-xs'><button onclick='pasteKey()' class='absolute left-2 top-1/2 -translate-y-1/2 bg-white/10 hover:bg-white/20 p-1.5 rounded-lg text-[9px] text-blue-400 font-bold'>PASTE</button></div><button onclick='activate()' id='btn' class='w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-2.5 rounded-xl shadow-lg active:scale-95 transition-all text-sm'>تفعيل</button><div id='msg' class='text-[9px] font-bold hidden text-center'></div></div></div><script>function pasteKey(){ window.webkit.messageHandlers.falconAuth.postMessage({action:'paste'}); } function setKey(val){ document.getElementById('k').value = val; } function activate(){ var code = document.getElementById('k').value; if(!code) return; document.getElementById('btn').disabled=true; document.getElementById('msg').innerHTML='جاري التحقق...'; document.getElementById('msg').className='text-blue-400 block animate-pulse'; window.webkit.messageHandlers.falconAuth.postMessage({action:'auth', code: code}); } function showResult(isSuccess, message){ document.getElementById('btn').disabled=false; document.getElementById('msg').innerHTML=message; document.getElementById('msg').className = isSuccess ? 'text-green-400 block' : 'text-red-500 block'; }</script></body></html>";
                  
                  [self.webView loadHTMLString:html baseURL:nil];
                  [self.window addSubview:self.webView];
                  [self.window makeKeyAndVisible];
              });
          }

          - (void)userContentController:(WKUserContentController *)userContentController didReceiveScriptMessage:(WKScriptMessage *)message {
              NSDictionary *body = (NSDictionary *)message.body;
              NSString *action = body[@"action"];
              if ([action isEqualToString:@"paste"]) {
                  NSString *clipboard = [UIPasteboard generalPasteboard].string;
                  if (clipboard) [self.webView evaluateJavaScript:[NSString stringWithFormat:@"setKey('%@')", clipboard] completionHandler:nil];
              } else if ([action isEqualToString:@"auth"]) {
                  NSString *code = body[@"code"];
                  NSString *udid = [[UIDevice currentDevice] identifierForVendor].UUIDString;
                  // 🔗 الرابط 1: المصادقة
                  NSString *url = [NSString stringWithFormat:@"%@?action=auth&code=%@&udid=%@", apiUrlBase, code, udid];
                  [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:url] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                      dispatch_async(dispatch_get_main_queue(), ^{
                          if (e || !d) { [self.webView evaluateJavaScript:@"showResult(false, '❌ خطأ اتصال')" completionHandler:nil]; return; }
                          NSDictionary *json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                          if ([json[@"status"] isEqualToString:@"success"]) {
                              SaveLicenseKey(code); [self hide]; FetchDataFromServer();
                          } else {
                              [self.webView evaluateJavaScript:[NSString stringWithFormat:@"showResult(false, '%@')", json[@"message"]] completionHandler:nil];
                          }
                      });
                  }] resume];
              }
          }

          - (void)hide {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (self.window) { self.window.hidden = YES; self.window = nil; }
              });
          }
          @end

          /* ==========================================
             🛰️ FETCH DATA & SMART INJECTION
             ========================================== */
          void FetchDataFromServer() {
              NSString *code = GetSavedLicenseKey();
              NSString *udid = [[UIDevice currentDevice] identifierForVendor].UUIDString;
              // 🔗 الرابط 2: سحب الأوفستات
              NSString *url = [NSString stringWithFormat:@"%@?action=get_offsets&code=%@&udid=%@", apiUrlBase, code, udid];
              [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:url] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (d) {
                      NSDictionary *oj = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                      if (oj[@"payload"]) {
                          NSData *decoded = [[NSData alloc] initWithBase64EncodedString:oj[@"payload"] options:0];
                          NSArray *list = [NSJSONSerialization JSONObjectWithData:decoded options:0 error:nil];
                          
                          // 🎯 قنص الجاسوس 0x4b2d3d0 بعد 40 ثانية بالضبط
                          dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 40 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                              uintptr_t baseShadow = GetBase("ShadowTrackerExtra");
                              if (baseShadow > 0) { Patch(baseShadow + 0x4b2d3d0, {0x1F, 0x20, 0x03, 0xD5}); }
                          });

                          if (list) {
                              for (NSDictionary *item in list) {
                                  NSString *target = item[@"target_module"];
                                  uintptr_t base = GetBase([target UTF8String]);
                                  if (base > 0) {
                                      uintptr_t off = strtoull([item[@"offset_hex"] UTF8String], NULL, 16);
                                      Patch(base + off, {0xC0, 0x03, 0x5F, 0xD6}); // RET
                                      // 🔗 الرابط 3: التبليغ
                                      NSString *rep = [NSString stringWithFormat:@"%@?action=mark_injected&hex=%@&code=%@&udid=%@", apiUrlBase, item[@"offset_hex"], code, udid];
                                      [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:rep]] resume];
                                  }
                              }
                          }
                          ApplyCryzerSpoofing();
                      }
                  }
              }] resume];
          }

          /* ==========================================
             🚀 CRYZER HOOKS - تزييف معلومات كاذبة
             ========================================== */
          void DisableAntiCheatForCryzer(ASTExtraBaseCharacter* c) {
              c.bRecordKillData = NO; c.IsEnableReportRoute = NO; c.IsEnableLogAIPlayerPos = NO;
              c.IsEnableReportPlayerKillFlow = NO; c.IsEnableReportGameSetting = NO;
              c.EnableReportGameSettingLevel = 0; c.IsEnableReportMrpcsInCircleFlow = NO;
              c.IsEnableReportMrpcsInPartCircleFlow = NO; c.IsEnableReportMrpcsFlow = NO;
              c.bDetectingPaintDecalTarget = NO; c.EnableReverseVerityBlock = NO;
          }

          void ApplyCryzerSpoofing() {
              NSLog(@"[Falcon] 🛡️ Cryzer AntiBan: Spoofing Data...");
              // هنا يتم البحث عن الكائنات وتطبيق التزييف باستخدام DisableAntiCheatForCryzer
          }

          uintptr_t GetBase(const char* name) {
              uint32_t count = _dyld_image_count();
              for (uint32_t i = 0; i < count; i++) {
                  const char* img_name = _dyld_get_image_name(i);
                  if (img_name && strstr(img_name, name)) return _dyld_get_image_vmaddr_slide(i) + 0x100000000;
              }
              return 0;
          }

          void Patch(uintptr_t addr, std::vector<uint8_t> data) {
              mach_port_t t = mach_task_self();
              vm_protect(t, addr, data.size(), FALSE, VM_PROT_READ | VM_PROT_WRITE | VM_PROT_COPY);
              vm_write(t, addr, (vm_offset_t)data.data(), (mach_msg_type_number_t)data.size());
              vm_protect(t, addr, data.size(), FALSE, VM_PROT_READ | VM_PROT_EXECUTE);
          }

          void SaveLicenseKey(NSString* key) { [[NSUserDefaults standardUserDefaults] setObject:key forKey:@"FalconEyeKey"]; }
          NSString* GetSavedLicenseKey() { return [[NSUserDefaults standardUserDefaults] stringForKey:@"FalconEyeKey"]; }

          __attribute__((constructor)) static void init() {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 6 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  [[FalconUI sharedInstance] show];
              });
          }
          EOF

      - name: Build Framework Payload
        run: |
          clang++ -dynamiclib -arch arm64 -x objective-c++ -std=c++17 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -framework Foundation -framework UIKit -framework WebKit \
          -framework QuartzCore -framework CoreGraphics \
          FalconEye.mm -o FalconEye.dylib
          if [ -f FalconEye.dylib ]; then
            strip -x FalconEye.dylib
          fi

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-Ultimate-System
          path: FalconEye.dylib
