name: Falcon Eye - Ultimate Integrated Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_everything:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Falcon Source
        run: |
          cat <<'EOF' > FalconEye.mm
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <mach-o/dyld.h>
          #import <mach/mach.h>
          #import <objc/runtime.h>
          #include <vector>
          #include <map>
          #include <string>

          NSString *apiUrlBase = @"http://34.204.178.160/api.php";

          // Forward Declarations
          uintptr_t GetBase(const char* name);
          bool Patch(uintptr_t addr, std::vector<uint8_t> data);
          void FetchDataFromServer(void);
          void StartHeartbeat(void);
          void AutoLoginCheck(void);

          void SaveLicenseKey(NSString* key) { [[NSUserDefaults standardUserDefaults] setObject:key forKey:@"FalconEyeKey"]; }
          NSString* GetSavedLicenseKey() { return [[NSUserDefaults standardUserDefaults] stringForKey:@"FalconEyeKey"]; }

          NSString* EncodeB64(NSString* input) {
              NSData* data = [input dataUsingEncoding:NSUTF8StringEncoding];
              return [data base64EncodedStringWithOptions:0];
          }

          // ==========================================
          // 🪟 Passthrough Window (For HUD)
          // ==========================================
          @interface PassthroughWindow : UIWindow
          @end
          @implementation PassthroughWindow
          - (UIView *)hitTest:(CGPoint)point withEvent:(UIEvent *)event {
              UIView *hitView = [super hitTest:point withEvent:event];
              if (hitView == self || [hitView isKindOfClass:[UILabel class]]) return nil;
              return hitView;
          }
          @end

          // ==========================================
          // 🕹️ HUD Status Bar & Bypass Button
          // ==========================================
          @interface FalconHUD : NSObject
          @property (nonatomic, strong) PassthroughWindow *hudWindow;
          @property (nonatomic, strong) UILabel *statusLabel;
          @property (nonatomic, strong) UIButton *bypassButton;
          + (instancetype)sharedInstance;
          - (void)showHUD;
          - (void)hideHUD;
          - (void)updateStatus:(NSString *)status color:(UIColor *)color;
          @end

          @implementation FalconHUD
          + (instancetype)sharedInstance {
              static FalconHUD *shared = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{ shared = [[FalconHUD alloc] init]; });
              return shared;
          }

          - (void)showHUD {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (self.hudWindow) return;
                  
                  CGFloat screenWidth = [UIScreen mainScreen].bounds.size.width;
                  self.hudWindow = [[PassthroughWindow alloc] initWithFrame:CGRectMake(0, 10, screenWidth, 30)];
                  self.hudWindow.windowLevel = UIWindowLevelAlert + 500;
                  self.hudWindow.backgroundColor = [UIColor clearColor];
                  self.hudWindow.userInteractionEnabled = YES; 
                  
                  UIStackView *stack = [[UIStackView alloc] init];
                  stack.axis = UILayoutConstraintAxisHorizontal;
                  stack.spacing = 12;
                  stack.alignment = UIStackViewAlignmentCenter;
                  stack.translatesAutoresizingMaskIntoConstraints = NO;
                  
                  self.statusLabel = [[UILabel alloc] init];
                  self.statusLabel.font = [UIFont boldSystemFontOfSize:11];
                  self.statusLabel.textColor = [UIColor yellowColor];
                  self.statusLabel.layer.shadowColor = [UIColor blackColor].CGColor;
                  self.statusLabel.layer.shadowOffset = CGSizeMake(1, 1);
                  self.statusLabel.layer.shadowOpacity = 1.0;
                  self.statusLabel.layer.shadowRadius = 2.0;
                  self.statusLabel.text = @"🟡 WAITING INJECTION...";
                  
                  self.bypassButton = [UIButton buttonWithType:UIButtonTypeSystem];
                  [self.bypassButton setTitle:@" BYPASS 🔴 " forState:UIControlStateNormal];
                  [self.bypassButton setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  self.bypassButton.titleLabel.font = [UIFont boldSystemFontOfSize:11];
                  self.bypassButton.backgroundColor = [UIColor colorWithWhite:0 alpha:0.6];
                  self.bypassButton.layer.cornerRadius = 6;
                  self.bypassButton.layer.borderWidth = 1;
                  self.bypassButton.layer.borderColor = [UIColor redColor].CGColor;
                  self.bypassButton.contentEdgeInsets = UIEdgeInsetsMake(3, 8, 3, 8);
                  
                  [self.bypassButton addTarget:self action:@selector(manualBypassTapped) forControlEvents:UIControlEventTouchUpInside];
                  
                  [stack addArrangedSubview:self.statusLabel];
                  [stack addArrangedSubview:self.bypassButton];
                  
                  [self.hudWindow addSubview:stack];
                  [stack.centerXAnchor constraintEqualToAnchor:self.hudWindow.centerXAnchor].active = YES;
                  [stack.centerYAnchor constraintEqualToAnchor:self.hudWindow.centerYAnchor].active = YES;
                  
                  [self.hudWindow makeKeyAndVisible];
              });
          }

          - (void)hideHUD {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (self.hudWindow) {
                      self.hudWindow.hidden = YES;
                      self.hudWindow = nil;
                  }
              });
          }

          - (void)updateStatus:(NSString *)status color:(UIColor *)color {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (self.statusLabel) {
                      self.statusLabel.text = status;
                      self.statusLabel.textColor = color;
                  }
              });
          }

          - (void)manualBypassTapped {
              [self.bypassButton setTitle:@" BYPASS ⏳ " forState:UIControlStateNormal];
              self.bypassButton.layer.borderColor = [UIColor yellowColor].CGColor;
              self.bypassButton.userInteractionEnabled = NO;
              
              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
                  [NSThread sleepForTimeInterval:0.5]; 
                  uintptr_t baseShadow = GetBase("ShadowTrackerExtra");
                  BOOL success = NO;
                  
                  if (baseShadow > 0) {
                      success = Patch(baseShadow + 0x4B2D3AC, {0x1F, 0x20, 0x03, 0xD5}); 
                  }
                  
                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (success) {
                          [self.bypassButton setTitle:@" BYPASS ✅ " forState:UIControlStateNormal];
                          self.bypassButton.layer.borderColor = [UIColor greenColor].CGColor;
                      } else {
                          [self.bypassButton setTitle:@" BYPASS ❌ " forState:UIControlStateNormal];
                          self.bypassButton.layer.borderColor = [UIColor redColor].CGColor;
                          self.bypassButton.userInteractionEnabled = YES; 
                      }
                  });
              });
          }
          @end

          // ==========================================
          // 🔒 Auth View Controller (Web-Based Beautiful UI)
          // ==========================================
          @interface FalconAuthViewController : UIViewController <WKScriptMessageHandler>
          @property (nonatomic, strong) WKWebView *webView;
          @end

          @implementation FalconAuthViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              
              self.view.backgroundColor = [UIColor colorWithWhite:0 alpha:0.85];
              
              WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
              [config.userContentController addScriptMessageHandler:self name:@"falconAuth"];
              
              self.webView = [[WKWebView alloc] initWithFrame:self.view.bounds configuration:config];
              self.webView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              self.webView.backgroundColor = [UIColor clearColor];
              self.webView.opaque = NO;
              self.webView.scrollView.scrollEnabled = NO;
              self.webView.scrollView.bounces = NO;
              
              [self.view addSubview:self.webView];
              
              // 🔥 واجهة تسجيل الدخول والتوقيت الاحترافي (كل ثانيتين) 🔥
              NSString *html = @"<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><script src='https://cdn.tailwindcss.com'></script><style>body { background: transparent; margin: 0; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', Courier, monospace; user-select: none; } .glass { background: rgba(10, 15, 30, 0.95); border: 1px solid rgba(59, 130, 246, 0.4); border-radius: 20px; padding: 35px; width: 400px; box-shadow: 0 0 40px rgba(0,0,0,0.8); } </style></head><body><div class='glass' id='box'><h1 class='text-3xl font-black text-white italic mb-1 tracking-tighter text-center'>FALCON<span class='text-blue-500'>EYE</span></h1><p class='text-[10px] text-blue-400 font-bold tracking-widest mb-6 uppercase text-center'>System Authentication</p><div class='relative mb-5'><input type='text' id='k' placeholder='أدخل كود التفعيل' class='w-full bg-[#020617] border border-blue-500/30 rounded-xl p-4 text-white text-center outline-none focus:border-blue-500 transition-all font-bold text-sm tracking-widest' dir='ltr'><button onclick='pasteKey()' class='absolute left-2 top-1/2 -translate-y-1/2 bg-blue-600/20 hover:bg-blue-600/40 px-3 py-2 rounded-lg text-[10px] text-blue-400 font-bold uppercase transition-all'>لصق</button></div><div id='msg' class='text-center mb-3 min-h-[20px] hidden'></div><button onclick='startAuth()' id='btn' class='w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3.5 rounded-xl shadow-lg active:scale-95 transition-all text-sm tracking-widest'>تسجيل الدخول</button></div><script>function pasteKey(){ window.webkit.messageHandlers.falconAuth.postMessage({action:'paste'}); } function setKey(val){ document.getElementById('k').value = val; } async function startAuth(){ var c = document.getElementById('k').value.trim(); if(!c) return; document.getElementById('btn').disabled = true; document.getElementById('btn').style.opacity = '0.5'; const msg = document.getElementById('msg'); msg.style.display = 'block'; msg.innerHTML = '<span style=\"color:#eab308; font-size:13px; font-weight:bold;\">⏳ جاري الاتصال بالسيرفر...</span>'; await new Promise(r => setTimeout(r, 2000)); msg.innerHTML = '<span style=\"color:#3b82f6; font-size:13px; font-weight:bold;\">🔐 جاري توثيق المزامنه...</span>'; await new Promise(r => setTimeout(r, 2000)); window.webkit.messageHandlers.falconAuth.postMessage({action:'auth', code: c}); } async function showResult(isSuccess, b64Message){ const msg = document.getElementById('msg'); if(isSuccess){ msg.innerHTML = '<span style=\"color:#a855f7; font-size:13px; font-weight:bold;\">⚙️ جاري التفعيل...</span>'; await new Promise(r => setTimeout(r, 2000)); msg.innerHTML = '<span style=\"color:#10b981; font-size:15px; font-weight:900;\">✅ تم التفعيل بنجاح!</span>'; await new Promise(r => setTimeout(r, 2000)); window.webkit.messageHandlers.falconAuth.postMessage({action:'closeWindow'}); } else { try { let err = decodeURIComponent(escape(window.atob(b64Message))); msg.innerHTML = '<span style=\"color:#ef4444; font-size:13px; font-weight:bold;\">❌ ' + err + '</span>'; } catch(e){ msg.innerHTML = '<span style=\"color:#ef4444; font-size:13px; font-weight:bold;\">❌ فشل التحقق</span>'; } setTimeout(() => { document.getElementById('btn').disabled = false; document.getElementById('btn').style.opacity = '1'; msg.style.display = 'none'; msg.innerHTML = ''; }, 3000); } }</script></body></html>";
              
              [self.webView loadHTMLString:html baseURL:nil];
          }

          - (void)userContentController:(WKUserContentController *)userContentController didReceiveScriptMessage:(WKScriptMessage *)message {
              NSDictionary *data = (NSDictionary *)message.body;
              NSString *action = data[@"action"];
              
              if ([action isEqualToString:@"paste"]) {
                  NSString *p = [UIPasteboard generalPasteboard].string;
                  if (p) {
                      p = [p stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
                      [self.webView evaluateJavaScript:[NSString stringWithFormat:@"setKey('%@')", p] completionHandler:nil];
                  }
              } else if ([action isEqualToString:@"auth"]) {
                  NSString *c = [data[@"code"] stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
                  NSString *u = [[UIDevice currentDevice] identifierForVendor].UUIDString;
                  
                  NSString *rawUrl = [NSString stringWithFormat:@"%@?action=auth&code=%@&udid=%@", apiUrlBase, c, u];
                  NSString *encodedUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
                  
                  [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encodedUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                      dispatch_async(dispatch_get_main_queue(), ^{
                          if (e || !d) { 
                              NSString *errorMsg = @"لا يوجد اتصال بالسيرفر";
                              [self.webView evaluateJavaScript:[NSString stringWithFormat:@"showResult(false, '%@')", EncodeB64(errorMsg)] completionHandler:nil];
                              return; 
                          }
                          
                          NSDictionary *json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                          if ([json[@"status"] isEqualToString:@"success"]) {
                              SaveLicenseKey(c);
                              [self.webView evaluateJavaScript:@"showResult(true, '')" completionHandler:nil];
                          } else {
                              NSString *errMsg = json[@"message"] ?: @"الكود غير صحيح";
                              [self.webView evaluateJavaScript:[NSString stringWithFormat:@"showResult(false, '%@')", EncodeB64(errMsg)] completionHandler:nil];
                          }
                      });
                  }] resume];
              } else if ([action isEqualToString:@"closeWindow"]) {
                  // الإغلاق الآمن للوحة وبدء الحقن
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [self dismissViewControllerAnimated:NO completion:^{
                          extern void FetchDataFromServer();
                          FetchDataFromServer();
                      }];
                  });
              }
          }
          @end

          // ==========================================
          // 🛡️ UI Manager & Window Handler
          // ==========================================
          @interface FalconUI : NSObject
          + (void)showAuthScreen;
          + (void)showMaintenanceScreen:(NSString *)msg;
          + (void)hideMaintenanceScreen;
          @end

          static UIWindow *authWindow = nil;
          static UIViewController *maintenanceVC = nil;

          @implementation FalconUI
          + (void)showAuthScreen {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (authWindow && authWindow.alpha > 0) return;
                  
                  UIWindow *window = nil;
                  if (@available(iOS 13.0, *)) {
                      for (UIWindowScene* scene in [UIApplication sharedApplication].connectedScenes) {
                          if (scene.activationState == UISceneActivationStateForegroundActive) { window = scene.windows.firstObject; break; }
                      }
                  }
                  if (!window) window = [UIApplication sharedApplication].keyWindow;

                  if (window && window.rootViewController) {
                      if ([window.rootViewController.presentedViewController isKindOfClass:[FalconAuthViewController class]]) return;
                      
                      authWindow = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                      authWindow.windowLevel = UIWindowLevelAlert + 1000;
                      authWindow.rootViewController = [[FalconAuthViewController alloc] init];
                      [authWindow makeKeyAndVisible];
                  } else {
                      dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 0.5 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                          [self showAuthScreen];
                      });
                  }
              });
          }

          + (void)showMaintenanceScreen:(NSString *)msg {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (maintenanceVC) return;
                  
                  UIWindow *window = nil;
                  if (@available(iOS 13.0, *)) {
                      for (UIWindowScene* scene in [UIApplication sharedApplication].connectedScenes) {
                          if (scene.activationState == UISceneActivationStateForegroundActive) { window = scene.windows.firstObject; break; }
                      }
                  }
                  if (!window) window = [UIApplication sharedApplication].keyWindow;

                  if (window && window.rootViewController) {
                      maintenanceVC = [[UIViewController alloc] init];
                      maintenanceVC.view.backgroundColor = [UIColor colorWithWhite:0 alpha:0.95];
                      
                      UILabel *lbl = [[UILabel alloc] initWithFrame:CGRectMake(0, 0, window.bounds.size.width, 100)];
                      lbl.center = maintenanceVC.view.center;
                      lbl.textAlignment = NSTextAlignmentCenter;
                      lbl.font = [UIFont boldSystemFontOfSize:22];
                      lbl.textColor = [UIColor redColor];
                      lbl.numberOfLines = 0;
                      lbl.text = [NSString stringWithFormat:@"⚠️ SYSTEM FROZEN:\n%@", msg];
                      
                      [maintenanceVC.view addSubview:lbl];
                      maintenanceVC.modalPresentationStyle = UIModalPresentationOverFullScreen;
                      [window.rootViewController presentViewController:maintenanceVC animated:NO completion:nil];
                  }
              });
          }

          + (void)hideMaintenanceScreen {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (maintenanceVC) {
                      [maintenanceVC dismissViewControllerAnimated:NO completion:nil];
                      maintenanceVC = nil;
                  }
              });
          }
          @end

          // ==========================================
          // 🛰️ Heartbeat (Live Monitoring)
          // ==========================================
          void StartHeartbeat() {
              static dispatch_source_t timer = nil;
              if (!timer) {
                  timer = dispatch_source_create(DISPATCH_SOURCE_TYPE_TIMER, 0, 0, dispatch_get_main_queue());
                  dispatch_source_set_timer(timer, dispatch_time(DISPATCH_TIME_NOW, 5.0 * NSEC_PER_SEC), 10.0 * NSEC_PER_SEC, 1.0 * NSEC_PER_SEC);
                  dispatch_source_set_event_handler(timer, ^{
                      
                      NSString *code = GetSavedLicenseKey();
                      NSString *udid = [[UIDevice currentDevice] identifierForVendor].UUIDString;
                      NSString *rawUrl = [NSString stringWithFormat:@"%@?action=check_status&code=%@&udid=%@", apiUrlBase, code, udid];
                      NSString *encodedUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
                      
                      [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encodedUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                          if (d && !e) {
                              NSDictionary *json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                              if ([json[@"maintenance"] isEqualToString:@"ON"]) {
                                  [FalconUI showMaintenanceScreen:json[@"message"]];
                              } else {
                                  [FalconUI hideMaintenanceScreen];
                              }
                              if ([json[@"security"] isEqualToString:@"RED"]) {
                                  [[FalconHUD sharedInstance] updateStatus:@"🔴 SECURITY ALERT: SYSTEM IS RED" color:[UIColor redColor]];
                              } else {
                                  [[FalconHUD sharedInstance] updateStatus:@"🟢 FALCON ACTIVE" color:[UIColor greenColor]];
                              }
                          }
                      }] resume];
                  });
                  dispatch_resume(timer);
              }
          }

          // ==========================================
          // 🚀 Safe COW Patching (No Jailbreak)
          // ==========================================
          uintptr_t GetBase(const char* name) {
              uint32_t count = _dyld_image_count();
              for (uint32_t i = 0; i < count; i++) {
                  if (strstr(_dyld_get_image_name(i), name)) return _dyld_get_image_vmaddr_slide(i) + 0x100000000;
              }
              return 0;
          }

          bool Patch(uintptr_t addr, std::vector<uint8_t> data) {
              if (addr == 0 || data.empty()) return false;
              mach_port_t task = mach_task_self();
              vm_size_t size = data.size();
              vm_address_t page_start = addr & ~PAGE_MASK;
              vm_size_t page_size = PAGE_SIZE;

              kern_return_t kr = vm_protect(task, page_start, page_size, FALSE, VM_PROT_READ | VM_PROT_WRITE | VM_PROT_COPY);
              if (kr != KERN_SUCCESS) return false;

              kr = vm_write(task, addr, (vm_offset_t)data.data(), (mach_msg_type_number_t)size);
              vm_protect(task, page_start, page_size, FALSE, VM_PROT_READ | VM_PROT_EXECUTE);
              // لمسح الكاش في الأجهزة العادية
              sys_icache_invalidate((void*)addr, size);
              return kr == KERN_SUCCESS;
          }

          // ==========================================
          // 🚀 Injection Logic (With Forced Telemetry)
          // ==========================================
          void SafeInjectLoop(NSMutableArray *offsetsList) {
              static int attempts = 0;
              if (attempts > 100) {
                  [[FalconHUD sharedInstance] updateStatus:@"❌ INJECTION FAILED" color:[UIColor redColor]];
                  return; 
              }
              
              BOOL allInjected = YES;
              for (NSMutableDictionary *item in offsetsList) {
                  if ([item[@"injected"] boolValue]) continue;

                  NSString *targetModule = item[@"target_module"];
                  if (!targetModule || targetModule.length == 0) targetModule = @"ShadowTrackerExtra";
                  
                  uintptr_t base = GetBase([targetModule UTF8String]);
                  if (base > 0) {
                      uintptr_t off = strtoull([item[@"offset_hex"] UTF8String], NULL, 16);
                      if (Patch(base + off, {0x1F, 0x20, 0x03, 0xD5})) {
                          [item setValue:@YES forKey:@"injected"];
                          
                          // 🔥 الإرسال الإجباري للسيرفر لإضاءة اللمبة 🔥
                          NSString *rawUrl = [NSString stringWithFormat:@"%@?action=mark_injected&hex=%@&code=%@&udid=%@", apiUrlBase, item[@"offset_hex"], GetSavedLicenseKey(), [[UIDevice currentDevice] identifierForVendor].UUIDString];
                          NSString *encodedUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
                          
                          [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encodedUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                              // هذه الدالة تضمن إرسال الطلب حتى النهاية
                          }] resume];
                      } else {
                          allInjected = NO;
                      }
                  } else {
                      allInjected = NO;
                  }
              }
              
              if (!allInjected) {
                  attempts++;
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                      SafeInjectLoop(offsetsList);
                  });
              } else {
                  [[FalconHUD sharedInstance] updateStatus:@"🟢 FALCON ACTIVE" color:[UIColor greenColor]];
              }
          }

          void FetchDataFromServer() {
              StartHeartbeat();

              NSString *code = GetSavedLicenseKey();
              NSString *udid = [[UIDevice currentDevice] identifierForVendor].UUIDString;
              NSString *rawUrl = [NSString stringWithFormat:@"%@?action=get_offsets&code=%@&udid=%@", apiUrlBase, code, udid];
              NSString *encodedUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
              
              [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encodedUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (d) {
                      NSDictionary *oj = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                      if ([oj[@"status"] isEqualToString:@"success"] && oj[@"payload"]) {
                          NSData *decoded = [[NSData alloc] initWithBase64EncodedString:oj[@"payload"] options:0];
                          NSArray *list = [NSJSONSerialization JSONObjectWithData:decoded options:0 error:nil];
                          
                          if (list && list.count > 0) {
                              NSMutableArray *mutableList = [NSMutableArray array];
                              for (NSDictionary *dict in list) {
                                  [mutableList addObject:[dict mutableCopy]];
                              }
                              
                              dispatch_async(dispatch_get_main_queue(), ^{
                                  [[FalconHUD sharedInstance] showHUD];
                              });
                              
                              SafeInjectLoop(mutableList);
                          } else {
                              dispatch_async(dispatch_get_main_queue(), ^{
                                  [[FalconHUD sharedInstance] hideHUD];
                              });
                          }
                      } else {
                          dispatch_async(dispatch_get_main_queue(), ^{
                              [[FalconHUD sharedInstance] hideHUD];
                          });
                      }
                  }
              }] resume];
          }

          void AutoLoginCheck() {
              NSString *k = GetSavedLicenseKey();
              if (k && k.length > 0) {
                  NSString *u = [[UIDevice currentDevice] identifierForVendor].UUIDString;
                  NSString *rawUrl = [NSString stringWithFormat:@"%@?action=auth&code=%@&udid=%@", apiUrlBase, k, u];
                  NSString *encodedUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
                  
                  [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encodedUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                      dispatch_async(dispatch_get_main_queue(), ^{
                          if (d && !e) {
                              NSDictionary *j = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                              if ([j[@"status"] isEqualToString:@"success"]) { 
                                  FetchDataFromServer();
                                  return; 
                              }
                          }
                          [FalconUI showAuthScreen];
                      });
                  }] resume];
              } else {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [FalconUI showAuthScreen];
                  });
              }
          }

          __attribute__((constructor)) static void init() {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.5 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  AutoLoginCheck();
              });
          }
          EOF

      - name: Build Framework Payload
        run: |
          clang++ -dynamiclib -arch arm64 -x objective-c++ -std=c++17 -fobjc-arc \
          -undefined dynamic_lookup \
          -miphoneos-version-min=12.0 -lobjc \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -framework Foundation -framework UIKit -framework WebKit \
          -framework QuartzCore -framework CoreGraphics \
          FalconEye.mm -o FalconEye.dylib
          
          if [ -f FalconEye.dylib ]; then strip -x FalconEye.dylib; else exit 1; fi

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-Ultimate-Engine
          path: FalconEye.dylib
          if-no-files-found: error
