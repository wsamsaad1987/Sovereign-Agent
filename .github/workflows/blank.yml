name: Falcon Eye - Ultimate Integrated Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_everything:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Falcon Source
        run: |
          cat <<'EOF' > FalconEye.mm
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <mach-o/dyld.h>
          #import <mach/mach.h>
          #import <objc/runtime.h>
          #include <libkern/OSCacheControl.h>
          #include <dlfcn.h>
          #include <vector>
          #include <map>
          #include <string>

          NSString *apiUrlBase = @"http://34.204.178.160/api.php";

          // Forward Declarations
          uintptr_t GetBase(const char* name);
          bool Patch(uintptr_t addr, std::vector<uint8_t> data);
          void FetchDataFromServer(void);
          void StartHeartbeat(void);
          void AutoLoginCheck(void);
          void ActivateV90Titan(void);

          void SaveLicenseKey(NSString* key) { [[NSUserDefaults standardUserDefaults] setObject:key forKey:@"FalconEyeKey"]; }
          NSString* GetSavedLicenseKey() { return [[NSUserDefaults standardUserDefaults] stringForKey:@"FalconEyeKey"]; }

          // ==========================================
          // 👻 1. الإخفاء العميق (Deep Ghost Mode & Anti-Dump)
          // ==========================================
          void ExecuteDeepGhostMode() {
              uint32_t count = _dyld_image_count();
              for (uint32_t i = 0; i < count; i++) {
                  const char *name = _dyld_get_image_name(i);
                  if (name && strstr(name, "FalconEye")) {
                      mach_port_t task = mach_task_self();
                      struct mach_header_64 *header = (struct mach_header_64 *)(_dyld_get_image_header(i));
                      vm_protect(task, (vm_address_t)header, 0x1000, FALSE, VM_PROT_READ | VM_PROT_WRITE | VM_PROT_COPY);
                      memset((void*)header, 0, sizeof(struct mach_header_64));
                      vm_protect(task, (vm_address_t)header, 0x1000, FALSE, VM_PROT_READ | VM_PROT_EXECUTE);
                      
                      vm_protect(task, (vm_address_t)name, strlen(name), FALSE, VM_PROT_READ | VM_PROT_WRITE | VM_PROT_COPY);
                      memset((void*)name, 0, strlen(name));
                      vm_protect(task, (vm_address_t)name, strlen(name), FALSE, VM_PROT_READ);
                      break;
                  }
              }
          }

          // ==========================================
          // 🛡️ 2. درع مكافحة التصحيح (Anti-Debug Shield)
          // ==========================================
          typedef int (*ptrace_ptr_t)(int _request, pid_t _pid, caddr_t _addr, int _data);
          void ExecuteAntiDebugShield() {
              void* handle = dlopen("/usr/lib/system/libsystem_kernel.dylib", RTLD_GLOBAL | RTLD_NOW);
              if (handle) {
                  ptrace_ptr_t ptrace_ptr = (ptrace_ptr_t)dlsym(handle, "ptrace");
                  if (ptrace_ptr) ptrace_ptr(31, 0, 0, 0); 
              }
          }

          // ==========================================
          // 🥷 3. منظومة V90 TITAN ANTI-CHEAT
          // ==========================================
          typedef BOOL (*fileExistsAtPath_t)(id, SEL, NSString *);
          fileExistsAtPath_t orig_fileExistsAtPath;

          BOOL hk_fileExistsAtPath(id self, SEL _cmd, NSString *path) {
              if ([path containsString:@"Cydia"] || [path containsString:@"Shadow"] || [path containsString:@"Imperial"] || [path containsString:@"libdobby"]) {
                  return NO;
              }
              return orig_fileExistsAtPath(self, _cmd, path);
          }

          typedef BOOL (*canOpenURL_t)(id, SEL, NSURL *);
          canOpenURL_t orig_canOpenURL;

          BOOL hk_canOpenURL(id self, SEL _cmd, NSURL *url) {
              NSString *scheme = [url scheme];
              if ([scheme containsString:@"cydia"] || [scheme containsString:@"filza"] || [scheme containsString:@"sileo"]) {
                  return NO; 
              }
              return orig_canOpenURL(self, _cmd, url);
          }

          void SetupSignatureSpoof() {
              Method m_info = class_getInstanceMethod([NSBundle class], @selector(infoDictionary));
              IMP orig_info = method_getImplementation(m_info);
              method_setImplementation(m_info, imp_implementationWithBlock(^NSDictionary* (id self) {
                  NSMutableDictionary *dict = [((NSDictionary*(*)(id, SEL))orig_info)(self, @selector(infoDictionary)) mutableCopy];
                  [dict setObject:@"Apple iPhone OS Application Signer" forKey:@"SignerIdentity"];
                  [dict setObject:@"com.apple.itunes.store" forKey:@"AppStoreInstaller"];
                  return dict;
              }));
          }

          void SetupIdentitySpoof() {
              method_setImplementation(class_getInstanceMethod([NSBundle class], @selector(bundleIdentifier)), imp_implementationWithBlock(^NSString* (id self) { return @"com.tencent.ig"; }));
              method_setImplementation(class_getInstanceMethod([UIDevice class], @selector(model)), imp_implementationWithBlock(^NSString* (id self) { return @"iPad"; }));
              method_setImplementation(class_getInstanceMethod([UIDevice class], @selector(name)), imp_implementationWithBlock(^NSString* (id self) { return @"iPad Pro (12.9-inch)"; }));
              method_setImplementation(class_getInstanceMethod([UIDevice class], @selector(systemVersion)), imp_implementationWithBlock(^NSString* (id self) { return @"17.4"; }));
          }

          void ActivateV90Titan() {
              SetupIdentitySpoof();       
              SetupSignatureSpoof();      
              
              Method m_file = class_getInstanceMethod([NSFileManager class], @selector(fileExistsAtPath:));
              orig_fileExistsAtPath = (fileExistsAtPath_t)method_getImplementation(m_file);
              method_setImplementation(m_file, imp_implementationWithBlock(^BOOL (id self, NSString *path) {
                  return hk_fileExistsAtPath(self, @selector(fileExistsAtPath:), path);
              }));

              Method m_url = class_getInstanceMethod([UIApplication class], @selector(canOpenURL:));
              orig_canOpenURL = (canOpenURL_t)method_getImplementation(m_url);
              method_setImplementation(m_url, imp_implementationWithBlock(^BOOL (id self, NSURL *url) {
                  return hk_canOpenURL(self, @selector(canOpenURL:), url);
              }));
              
              NSLog(@"[Falcon] 🛡️ V90 Titan Anti-Cheat Activated (20s Delayed)");
          }

          // ==========================================
          // 🪟 Passthrough Window (For HUD)
          // ==========================================
          @interface PassthroughWindow : UIWindow
          @end
          @implementation PassthroughWindow
          - (UIView *)hitTest:(CGPoint)point withEvent:(UIEvent *)event {
              UIView *hitView = [super hitTest:point withEvent:event];
              if (hitView == self || [hitView isKindOfClass:[UILabel class]]) return nil;
              return hitView;
          }
          @end

          // ==========================================
          // 🕹️ HUD Status Bar & Bypass Button
          // ==========================================
          @interface FalconHUD : NSObject
          @property (nonatomic, strong) PassthroughWindow *hudWindow;
          @property (nonatomic, strong) UILabel *statusLabel;
          @property (nonatomic, strong) UIButton *bypassButton;
          + (instancetype)sharedInstance;
          - (void)showHUD;
          - (void)updateStatus:(NSString *)status color:(UIColor *)color;
          @end

          @implementation FalconHUD
          + (instancetype)sharedInstance {
              static FalconHUD *shared = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{ shared = [[FalconHUD alloc] init]; });
              return shared;
          }

          - (void)showHUD {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (self.hudWindow) return;
                  
                  CGFloat screenWidth = [UIScreen mainScreen].bounds.size.width;
                  self.hudWindow = [[PassthroughWindow alloc] initWithFrame:CGRectMake(0, 10, screenWidth, 30)];
                  self.hudWindow.windowLevel = UIWindowLevelStatusBar + 100;
                  self.hudWindow.backgroundColor = [UIColor clearColor];
                  self.hudWindow.userInteractionEnabled = YES; 
                  
                  UIStackView *stack = [[UIStackView alloc] init];
                  stack.axis = UILayoutConstraintAxisHorizontal;
                  stack.spacing = 12;
                  stack.alignment = UIStackViewAlignmentCenter;
                  stack.translatesAutoresizingMaskIntoConstraints = NO;
                  
                  self.statusLabel = [[UILabel alloc] init];
                  self.statusLabel.font = [UIFont boldSystemFontOfSize:11];
                  self.statusLabel.textColor = [UIColor yellowColor];
                  self.statusLabel.layer.shadowColor = [UIColor blackColor].CGColor;
                  self.statusLabel.layer.shadowOffset = CGSizeMake(1, 1);
                  self.statusLabel.layer.shadowOpacity = 1.0;
                  self.statusLabel.layer.shadowRadius = 2.0;
                  self.statusLabel.text = @"🟡 SYSTEM BOOTING...";
                  
                  self.bypassButton = [UIButton buttonWithType:UIButtonTypeSystem];
                  [self.bypassButton setTitle:@" BYPASS 🔴 " forState:UIControlStateNormal];
                  [self.bypassButton setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  self.bypassButton.titleLabel.font = [UIFont boldSystemFontOfSize:11];
                  self.bypassButton.backgroundColor = [UIColor colorWithWhite:0 alpha:0.6];
                  self.bypassButton.layer.cornerRadius = 6;
                  self.bypassButton.layer.borderWidth = 1;
                  self.bypassButton.layer.borderColor = [UIColor redColor].CGColor;
                  self.bypassButton.contentEdgeInsets = UIEdgeInsetsMake(3, 8, 3, 8);
                  
                  [self.bypassButton addTarget:self action:@selector(manualBypassTapped) forControlEvents:UIControlEventTouchUpInside];
                  
                  [stack addArrangedSubview:self.statusLabel];
                  [stack addArrangedSubview:self.bypassButton];
                  
                  [self.hudWindow addSubview:stack];
                  [stack.centerXAnchor constraintEqualToAnchor:self.hudWindow.centerXAnchor].active = YES;
                  [stack.centerYAnchor constraintEqualToAnchor:self.hudWindow.centerYAnchor].active = YES;
                  
                  [self.hudWindow makeKeyAndVisible];
              });
          }

          - (void)updateStatus:(NSString *)status color:(UIColor *)color {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (self.statusLabel) {
                      self.statusLabel.text = status;
                      self.statusLabel.textColor = color;
                  }
              });
          }

          - (void)manualBypassTapped {
              [self.bypassButton setTitle:@" BYPASS ⏳ " forState:UIControlStateNormal];
              self.bypassButton.layer.borderColor = [UIColor yellowColor].CGColor;
              self.bypassButton.userInteractionEnabled = NO;
              
              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
                  [NSThread sleepForTimeInterval:0.5]; 
                  uintptr_t baseShadow = GetBase("ShadowTrackerExtra");
                  BOOL success = NO;
                  
                  if (baseShadow > 0) {
                      success = Patch(baseShadow + 0x4b2d3d0, {0x1F, 0x20, 0x03, 0xD5}); 
                  }
                  
                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (success) {
                          [self.bypassButton setTitle:@" BYPASS ✅ " forState:UIControlStateNormal];
                          self.bypassButton.layer.borderColor = [UIColor greenColor].CGColor;
                      } else {
                          [self.bypassButton setTitle:@" BYPASS ❌ " forState:UIControlStateNormal];
                          self.bypassButton.layer.borderColor = [UIColor redColor].CGColor;
                          self.bypassButton.userInteractionEnabled = YES; 
                      }
                  });
              });
          }
          @end

          // ==========================================
          // 🔒 Auth View Controller (Native iOS UI - No WebKit)
          // ==========================================
          @interface FalconAuthViewController : UIViewController
          @property (nonatomic, strong) UITextField *keyInput;
          @property (nonatomic, strong) UIButton *loginBtn;
          @property (nonatomic, strong) UILabel *statusLbl;
          @end

          @implementation FalconAuthViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              
              // خلفية شبه شفافة 85%
              self.view.backgroundColor = [UIColor colorWithWhite:0 alpha:0.85];
              
              // الصندوق الزجاجي (Glass Box)
              UIView *glassBox = [[UIView alloc] init];
              glassBox.backgroundColor = [UIColor colorWithRed:10/255.0 green:15/255.0 blue:30/255.0 alpha:0.95];
              glassBox.layer.cornerRadius = 20;
              glassBox.layer.borderColor = [UIColor colorWithRed:59/255.0 green:130/255.0 blue:246/255.0 alpha:0.4].CGColor;
              glassBox.layer.borderWidth = 1.0;
              glassBox.layer.shadowColor = [UIColor blackColor].CGColor;
              glassBox.layer.shadowOpacity = 0.8;
              glassBox.layer.shadowRadius = 20;
              glassBox.layer.shadowOffset = CGSizeMake(0, 0);
              glassBox.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:glassBox];
              
              // توسيط الصندوق
              [NSLayoutConstraint activateConstraints:@[
                  [glassBox.centerXAnchor constraintEqualToAnchor:self.view.centerXAnchor],
                  [glassBox.centerYAnchor constraintEqualToAnchor:self.view.centerYAnchor],
                  [glassBox.widthAnchor constraintEqualToConstant:350],
                  [glassBox.heightAnchor constraintEqualToConstant:260]
              ]];
              
              // العنوان
              UILabel *titleLbl = [[UILabel alloc] initWithFrame:CGRectMake(0, 20, 350, 40)];
              titleLbl.text = @"FALCON EYE";
              titleLbl.font = [UIFont italicSystemFontOfSize:30];
              titleLbl.textColor = [UIColor whiteColor];
              titleLbl.textAlignment = NSTextAlignmentCenter;
              [glassBox addSubview:titleLbl];
              
              UILabel *subLbl = [[UILabel alloc] initWithFrame:CGRectMake(0, 55, 350, 20)];
              subLbl.text = @"System Authentication";
              subLbl.font = [UIFont boldSystemFontOfSize:11];
              subLbl.textColor = [UIColor colorWithRed:96/255.0 green:165/255.0 blue:250/255.0 alpha:1.0];
              subLbl.textAlignment = NSTextAlignmentCenter;
              [glassBox addSubview:subLbl];
              
              // حقل الإدخال
              self.keyInput = [[UITextField alloc] initWithFrame:CGRectMake(25, 95, 300, 45)];
              self.keyInput.placeholder = @"أدخل كود التفعيل";
              self.keyInput.textColor = [UIColor whiteColor];
              self.keyInput.textAlignment = NSTextAlignmentCenter;
              self.keyInput.backgroundColor = [UIColor colorWithRed:2/255.0 green:6/255.0 blue:23/255.0 alpha:1.0];
              self.keyInput.layer.cornerRadius = 12;
              self.keyInput.layer.borderColor = [UIColor colorWithRed:59/255.0 green:130/255.0 blue:246/255.0 alpha:0.3].CGColor;
              self.keyInput.layer.borderWidth = 1;
              self.keyInput.font = [UIFont boldSystemFontOfSize:14];
              // تغيير لون الـ placeholder
              NSAttributedString *placeholderStr = [[NSAttributedString alloc] initWithString:@"أدخل كود التفعيل" attributes:@{NSForegroundColorAttributeName: [UIColor lightGrayColor]}];
              self.keyInput.attributedPlaceholder = placeholderStr;
              [glassBox addSubview:self.keyInput];
              
              // زر اللصق
              UIButton *pasteBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              pasteBtn.frame = CGRectMake(35, 102.5, 50, 30);
              [pasteBtn setTitle:@"لصق" forState:UIControlStateNormal];
              [pasteBtn setTitleColor:[UIColor colorWithRed:96/255.0 green:165/255.0 blue:250/255.0 alpha:1.0] forState:UIControlStateNormal];
              pasteBtn.titleLabel.font = [UIFont boldSystemFontOfSize:11];
              pasteBtn.backgroundColor = [UIColor colorWithRed:37/255.0 green:99/255.0 blue:235/255.0 alpha:0.2];
              pasteBtn.layer.cornerRadius = 8;
              [pasteBtn addTarget:self action:@selector(pasteTapped) forControlEvents:UIControlEventTouchUpInside];
              [glassBox addSubview:pasteBtn];
              
              // حالة التحميل (Label)
              self.statusLbl = [[UILabel alloc] initWithFrame:CGRectMake(0, 150, 350, 20)];
              self.statusLbl.text = @"";
              self.statusLbl.font = [UIFont boldSystemFontOfSize:13];
              self.statusLbl.textColor = [UIColor colorWithRed:234/255.0 green:179/255.0 blue:8/255.0 alpha:1.0]; // أصفر
              self.statusLbl.textAlignment = NSTextAlignmentCenter;
              [glassBox addSubview:self.statusLbl];
              
              // زر الدخول
              self.loginBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              self.loginBtn.frame = CGRectMake(25, 185, 300, 50);
              [self.loginBtn setTitle:@"تفعيل الأداة" forState:UIControlStateNormal];
              [self.loginBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              self.loginBtn.titleLabel.font = [UIFont boldSystemFontOfSize:15];
              self.loginBtn.backgroundColor = [UIColor colorWithRed:37/255.0 green:99/255.0 blue:235/255.0 alpha:1.0];
              self.loginBtn.layer.cornerRadius = 12;
              [self.loginBtn addTarget:self action:@selector(loginTapped) forControlEvents:UIControlEventTouchUpInside];
              [glassBox addSubview:self.loginBtn];
          }

          - (void)pasteTapped {
              NSString *clipboard = [UIPasteboard generalPasteboard].string;
              if (clipboard) {
                  self.keyInput.text = [clipboard stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
              }
          }

          - (void)loginTapped {
              NSString *code = [self.keyInput.text stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
              if (code.length == 0) return;
              
              self.loginBtn.enabled = NO;
              self.loginBtn.alpha = 0.5;
              self.statusLbl.textColor = [UIColor colorWithRed:234/255.0 green:179/255.0 blue:8/255.0 alpha:1.0];
              self.statusLbl.text = @"⏳ جاري التفعيل...";
              
              NSString *udid = [[UIDevice currentDevice] identifierForVendor].UUIDString;
              NSString *rawUrl = [NSString stringWithFormat:@"%@?action=auth&code=%@&udid=%@", apiUrlBase, code, udid];
              NSString *encodedUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
              
              [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encodedUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (e || !d) { 
                          self.statusLbl.textColor = [UIColor systemRedColor];
                          self.statusLbl.text = @"❌ لا يوجد اتصال بالسيرفر";
                          [self resetLoginButton];
                          return; 
                      }
                      
                      NSDictionary *json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                      if ([json[@"status"] isEqualToString:@"success"]) {
                          SaveLicenseKey(code);
                          self.statusLbl.textColor = [UIColor systemGreenColor];
                          self.statusLbl.text = @"✅ تم التفعيل بنجاح!";
                          
                          // إغلاق النافذة فوراً والبدء
                          dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 0.5 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                              extern void CloseAuthWindowAndStart();
                              CloseAuthWindowAndStart();
                          });
                      } else {
                          self.statusLbl.textColor = [UIColor systemRedColor];
                          self.statusLbl.text = [NSString stringWithFormat:@"❌ %@", json[@"message"] ?: @"الكود غير صحيح"];
                          [self resetLoginButton];
                      }
                  });
              }] resume];
          }

          - (void)resetLoginButton {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  self.loginBtn.enabled = YES;
                  self.loginBtn.alpha = 1.0;
                  self.statusLbl.text = @"";
              });
          }
          @end

          // ==========================================
          // 🛡️ UI Manager & Maintenance Screen
          // ==========================================
          @interface FalconUI : NSObject
          + (void)showAuthScreen;
          + (void)showMaintenanceScreen:(NSString *)msg;
          + (void)hideMaintenanceScreen;
          @end

          static UIWindow *authWindow = nil;
          static UIViewController *maintenanceVC = nil;

          void CloseAuthWindowAndStart() {
              if (authWindow) {
                  authWindow.hidden = YES;
                  authWindow = nil;
              }
              
              // 1. جلب الأوفستات وتشغيل البايباس فوراً
              FetchDataFromServer();
              
              // 2. تشغيل الحماية (V90 Titan) بعد 20 ثانية بالضبط!
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 20.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  ActivateV90Titan();
              });
          }

          @implementation FalconUI
          + (void)showAuthScreen {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (authWindow) return;
                  
                  UIWindow *window = nil;
                  if (@available(iOS 13.0, *)) {
                      for (UIWindowScene* scene in [UIApplication sharedApplication].connectedScenes) {
                          if (scene.activationState == UISceneActivationStateForegroundActive) { window = scene.windows.firstObject; break; }
                      }
                  }
                  if (!window) window = [UIApplication sharedApplication].keyWindow;

                  if (window && window.rootViewController) {
                      if ([window.rootViewController.presentedViewController isKindOfClass:[FalconAuthViewController class]]) return;
                      
                      FalconAuthViewController *authVC = [[FalconAuthViewController alloc] init];
                      authVC.modalPresentationStyle = UIModalPresentationOverFullScreen;
                      [window.rootViewController presentViewController:authVC animated:NO completion:nil];
                  } else {
                      dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 0.5 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                          [self showAuthScreen];
                      });
                  }
              });
          }

          + (void)showMaintenanceScreen:(NSString *)msg {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (maintenanceVC) return;
                  
                  UIWindow *window = nil;
                  if (@available(iOS 13.0, *)) {
                      for (UIWindowScene* scene in [UIApplication sharedApplication].connectedScenes) {
                          if (scene.activationState == UISceneActivationStateForegroundActive) { window = scene.windows.firstObject; break; }
                      }
                  }
                  if (!window) window = [UIApplication sharedApplication].keyWindow;

                  if (window && window.rootViewController) {
                      maintenanceVC = [[UIViewController alloc] init];
                      maintenanceVC.view.backgroundColor = [UIColor colorWithWhite:0 alpha:0.95];
                      
                      UILabel *lbl = [[UILabel alloc] initWithFrame:CGRectMake(0, 0, window.bounds.size.width, 100)];
                      lbl.center = maintenanceVC.view.center;
                      lbl.textAlignment = NSTextAlignmentCenter;
                      lbl.font = [UIFont boldSystemFontOfSize:22];
                      lbl.textColor = [UIColor redColor];
                      lbl.numberOfLines = 0;
                      lbl.text = [NSString stringWithFormat:@"⚠️ SYSTEM FROZEN:\n%@", msg];
                      
                      [maintenanceVC.view addSubview:lbl];
                      maintenanceVC.modalPresentationStyle = UIModalPresentationOverFullScreen;
                      [window.rootViewController presentViewController:maintenanceVC animated:NO completion:nil];
                  }
              });
          }

          + (void)hideMaintenanceScreen {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (maintenanceVC) {
                      [maintenanceVC dismissViewControllerAnimated:NO completion:nil];
                      maintenanceVC = nil;
                  }
              });
          }
          @end

          // ==========================================
          // 🛰️ Heartbeat (Live Monitoring & Thread Camo)
          // ==========================================
          void StartHeartbeat() {
              static dispatch_source_t timer = nil;
              if (!timer) {
                  timer = dispatch_source_create(DISPATCH_SOURCE_TYPE_TIMER, 0, 0, dispatch_get_main_queue());
                  dispatch_source_set_timer(timer, dispatch_time(DISPATCH_TIME_NOW, 5.0 * NSEC_PER_SEC), 10.0 * NSEC_PER_SEC, 1.0 * NSEC_PER_SEC);
                  dispatch_source_set_event_handler(timer, ^{
                      [[NSThread currentThread] setName:@"com.apple.uikit.networking"];
                      
                      NSString *code = GetSavedLicenseKey();
                      NSString *udid = [[UIDevice currentDevice] identifierForVendor].UUIDString;
                      NSString *url = [NSString stringWithFormat:@"%@?action=check_status&code=%@&udid=%@", apiUrlBase, code, udid];
                      
                      [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:url] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                          if (d && !e) {
                              NSDictionary *json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                              if ([json[@"maintenance"] isEqualToString:@"ON"]) {
                                  [FalconUI showMaintenanceScreen:json[@"message"]];
                              } else {
                                  [FalconUI hideMaintenanceScreen];
                              }
                              if ([json[@"security"] isEqualToString:@"RED"]) {
                                  [[FalconHUD sharedInstance] updateStatus:@"🔴 SECURITY ALERT: SYSTEM IS RED" color:[UIColor redColor]];
                              } else {
                                  [[FalconHUD sharedInstance] updateStatus:@"🟢 FALCON V90 | SECURE" color:[UIColor greenColor]];
                              }
                          }
                      }] resume];
                  });
                  dispatch_resume(timer);
              }
          }

          // ==========================================
          // 🚀 Safe COW Patching (No Jailbreak)
          // ==========================================
          uintptr_t GetBase(const char* name) {
              uint32_t count = _dyld_image_count();
              for (uint32_t i = 0; i < count; i++) {
                  if (strstr(_dyld_get_image_name(i), name)) return _dyld_get_image_vmaddr_slide(i) + 0x100000000;
              }
              return 0;
          }

          bool Patch(uintptr_t addr, std::vector<uint8_t> data) {
              if (addr == 0 || data.empty()) return false;
              mach_port_t task = mach_task_self();
              vm_size_t size = data.size();
              vm_address_t page_start = addr & ~PAGE_MASK;
              vm_size_t page_size = PAGE_SIZE;

              kern_return_t kr = vm_protect(task, page_start, page_size, FALSE, VM_PROT_READ | VM_PROT_WRITE | VM_PROT_COPY);
              if (kr != KERN_SUCCESS) return false;

              kr = vm_write(task, addr, (vm_offset_t)data.data(), (mach_msg_type_number_t)size);
              vm_protect(task, page_start, page_size, FALSE, VM_PROT_READ | VM_PROT_EXECUTE);
              sys_icache_invalidate((void*)addr, size);
              return kr == KERN_SUCCESS;
          }

          // ==========================================
          // 🚀 Injection Logic
          // ==========================================
          void SafeInjectLoop(NSMutableArray *offsetsList) {
              static int attempts = 0;
              if (attempts > 100) return; 
              
              BOOL allInjected = YES;
              for (NSMutableDictionary *item in offsetsList) {
                  if ([item[@"injected"] boolValue]) continue;

                  NSString *targetModule = item[@"target_module"];
                  if (!targetModule || targetModule.length == 0) targetModule = @"ShadowTrackerExtra";
                  
                  uintptr_t base = GetBase([targetModule UTF8String]);
                  if (base > 0) {
                      uintptr_t off = strtoull([item[@"offset_hex"] UTF8String], NULL, 16);
                      if (Patch(base + off, {0x1F, 0x20, 0x03, 0xD5})) {
                          [item setValue:@YES forKey:@"injected"];
                          NSString *url = [NSString stringWithFormat:@"%@?action=mark_injected&hex=%@&code=%@&udid=%@", apiUrlBase, item[@"offset_hex"], GetSavedLicenseKey(), [[UIDevice currentDevice] identifierForVendor].UUIDString];
                          [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:url]] resume];
                      } else {
                          allInjected = NO;
                      }
                  } else {
                      allInjected = NO;
                  }
              }
              
              if (!allInjected) {
                  attempts++;
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                      SafeInjectLoop(offsetsList);
                  });
              }
          }

          void FetchDataFromServer() {
              StartHeartbeat();

              NSString *code = GetSavedLicenseKey();
              NSString *udid = [[UIDevice currentDevice] identifierForVendor].UUIDString;
              NSString *url = [NSString stringWithFormat:@"%@?action=get_offsets&code=%@&udid=%@", apiUrlBase, code, udid];
              
              [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:url] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (d) {
                      NSDictionary *oj = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                      if (oj[@"payload"]) {
                          NSData *decoded = [[NSData alloc] initWithBase64EncodedString:oj[@"payload"] options:0];
                          NSArray *list = [NSJSONSerialization JSONObjectWithData:decoded options:0 error:nil];
                          
                          NSMutableArray *mutableList = [NSMutableArray array];
                          for (NSDictionary *dict in list) {
                              [mutableList addObject:[dict mutableCopy]];
                          }

                          if (mutableList.count > 0) {
                              SafeInjectLoop(mutableList);
                          }
                      }
                  }
              }] resume];
          }

          void AutoLoginCheck() {
              NSString *k = GetSavedLicenseKey();
              if (k && k.length > 0) {
                  NSString *u = [[UIDevice currentDevice] identifierForVendor].UUIDString;
                  NSString *rawUrl = [NSString stringWithFormat:@"%@?action=auth&code=%@&udid=%@", apiUrlBase, k, u];
                  NSString *encodedUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
                  
                  [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encodedUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                      dispatch_async(dispatch_get_main_queue(), ^{
                          if (d && !e) {
                              NSDictionary *j = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                              if ([j[@"status"] isEqualToString:@"success"]) { 
                                  // دخول ناجح: إخفاء الواجهة، وتشغيل الحماية بعد 20 ثانية
                                  CloseAuthWindowAndStart();
                                  return; 
                              }
                          }
                          [FalconUI showAuthScreen];
                      });
                  }] resume];
              } else {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [FalconUI showAuthScreen];
                  });
              }
          }

          __attribute__((constructor)) static void init() {
              ExecuteDeepGhostMode(); 
              ExecuteAntiDebugShield(); 
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  AutoLoginCheck();
              });
          }
          EOF

      - name: Build Framework Payload
        run: |
          clang++ -dynamiclib -arch arm64 -x objective-c++ -std=c++17 -fobjc-arc \
          -undefined dynamic_lookup \
          -miphoneos-version-min=12.0 -lobjc \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -framework Foundation -framework UIKit \
          -framework QuartzCore -framework CoreGraphics \
          FalconEye.mm -o FalconEye.dylib
          
          if [ -f FalconEye.dylib ]; then strip -x FalconEye.dylib; else exit 1; fi

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-Ultimate-Engine
          path: FalconEye.dylib
          if-no-files-found: error
