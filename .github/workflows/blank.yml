name: Falcon Eye - Ultimate Integrated Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_everything:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Generate Falcon Source
        run: |
          cat <<'EOF' > FalconEye.mm
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <mach-o/dyld.h>
          #import <mach/mach.h>
          #include <libkern/OSCacheControl.h>
          #include <vector>
          #include <map>
          #include <string>

          // إعلانات مسبقة للدوال حتى نستخدمها بالزر اليدوي
          uintptr_t GetBase(const char* name);
          bool Patch(uintptr_t addr, std::vector<uint8_t> data);
          void FetchDataFromServer(void);
          void StartHeartbeat(void);

          /* ==========================================
             🛡️ CRYZER ANTI-CHEAT STRUCTURES
             ========================================== */
          struct ASTExtraBaseCharacter {
              bool bRecordKillData, IsEnableReportRoute, IsEnableLogAIPlayerPos, IsEnableReportPlayerKillFlow;
              bool IsEnableReportGameSetting, EnableReverseVerityBlock, bDetectingPaintDecalTarget;
              bool IsEnableReportMrpcsInCircleFlow, IsEnableReportMrpcsInPartCircleFlow, IsEnableReportMrpcsFlow;
              int EnableReportGameSettingLevel;
          };

          NSString *apiUrlBase = @"http://34.204.178.160/api.php";

          void SaveLicenseKey(NSString* key) { [[NSUserDefaults standardUserDefaults] setObject:key forKey:@"FalconEyeKey"]; }
          NSString* GetSavedLicenseKey() { return [[NSUserDefaults standardUserDefaults] stringForKey:@"FalconEyeKey"]; }

          /* ==========================================
             🪟 شباك شفاف للمس (حتى لا يعيق اللعب)
             ========================================== */
          @interface PassthroughWindow : UIWindow
          @end
          @implementation PassthroughWindow
          - (UIView *)hitTest:(CGPoint)point withEvent:(UIEvent *)event {
              UIView *hitView = [super hitTest:point withEvent:event];
              // إذا كان اللمس على الشباك الفارغ أو النص، نتجاهله حتى يوصل للعبة
              if (hitView == self || [hitView isKindOfClass:[UILabel class]]) return nil;
              return hitView; // اللمس فقط للزر (UIButton)
          }
          @end

          // ==========================================
          // 🕹️ شريط الحالة الصغير والثابت (Native Text HUD + Button)
          // ==========================================
          @interface FalconHUD : NSObject
          @property (nonatomic, strong) PassthroughWindow *hudWindow;
          @property (nonatomic, strong) UILabel *statusLabel;
          @property (nonatomic, strong) UIButton *bypassButton;
          + (instancetype)sharedInstance;
          - (void)showHUD;
          - (void)updateStatus:(NSString *)status color:(UIColor *)color;
          @end

          @implementation FalconHUD
          + (instancetype)sharedInstance {
              static FalconHUD *shared = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{ shared = [[FalconHUD alloc] init]; });
              return shared;
          }

          - (void)showHUD {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (self.hudWindow) return;
                  
                  CGFloat screenWidth = [UIScreen mainScreen].bounds.size.width;
                  self.hudWindow = [[PassthroughWindow alloc] initWithFrame:CGRectMake(0, 10, screenWidth, 30)];
                  self.hudWindow.windowLevel = UIWindowLevelStatusBar + 100;
                  self.hudWindow.backgroundColor = [UIColor clearColor];
                  // يجب أن تكون YES حتى نستقبل اللمس على الزر
                  self.hudWindow.userInteractionEnabled = YES; 
                  
                  // ترتيب أفقي متناسق
                  UIStackView *stack = [[UIStackView alloc] init];
                  stack.axis = UILayoutConstraintAxisHorizontal;
                  stack.spacing = 12;
                  stack.alignment = UIStackViewAlignmentCenter;
                  stack.translatesAutoresizingMaskIntoConstraints = NO;
                  
                  self.statusLabel = [[UILabel alloc] init];
                  self.statusLabel.font = [UIFont boldSystemFontOfSize:11];
                  self.statusLabel.textColor = [UIColor yellowColor];
                  self.statusLabel.layer.shadowColor = [UIColor blackColor].CGColor;
                  self.statusLabel.layer.shadowOffset = CGSizeMake(1, 1);
                  self.statusLabel.layer.shadowOpacity = 1.0;
                  self.statusLabel.layer.shadowRadius = 2.0;
                  self.statusLabel.text = @"🟡 System Booting...";
                  
                  // 🔥 الزر اليدوي اللي طلبته (Bypass) 🔥
                  self.bypassButton = [UIButton buttonWithType:UIButtonTypeSystem];
                  [self.bypassButton setTitle:@" Bypass 🔴 " forState:UIControlStateNormal];
                  [self.bypassButton setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  self.bypassButton.titleLabel.font = [UIFont boldSystemFontOfSize:11];
                  self.bypassButton.backgroundColor = [UIColor colorWithWhite:0 alpha:0.6];
                  self.bypassButton.layer.cornerRadius = 6;
                  self.bypassButton.layer.borderWidth = 1;
                  self.bypassButton.layer.borderColor = [UIColor redColor].CGColor;
                  self.bypassButton.contentEdgeInsets = UIEdgeInsetsMake(3, 8, 3, 8);
                  
                  [self.bypassButton addTarget:self action:@selector(manualBypassTapped) forControlEvents:UIControlEventTouchUpInside];
                  
                  [stack addArrangedSubview:self.statusLabel];
                  [stack addArrangedSubview:self.bypassButton];
                  
                  [self.hudWindow addSubview:stack];
                  
                  // تثبيت بنص الشاشة
                  [stack.centerXAnchor constraintEqualToAnchor:self.hudWindow.centerXAnchor].active = YES;
                  [stack.centerYAnchor constraintEqualToAnchor:self.hudWindow.centerYAnchor].active = YES;
                  
                  [self.hudWindow makeKeyAndVisible];
              });
          }

          - (void)updateStatus:(NSString *)status color:(UIColor *)color {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (self.statusLabel) {
                      self.statusLabel.text = status;
                      self.statusLabel.textColor = color;
                  }
              });
          }

          // وظيفة الزر اليدوي
          - (void)manualBypassTapped {
              // 1. تحويل الزر للودنك (⏳)
              [self.bypassButton setTitle:@" Bypass ⏳ " forState:UIControlStateNormal];
              self.bypassButton.layer.borderColor = [UIColor yellowColor].CGColor;
              self.bypassButton.userInteractionEnabled = NO; // نمنع الضغط مرتين
              
              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
                  [NSThread sleepForTimeInterval:0.5]; // تأثير تحميل واقعي
                  
                  uintptr_t baseShadow = GetBase("ShadowTrackerExtra");
                  BOOL success = NO;
                  
                  if (baseShadow > 0) {
                      // 💥 قنص الأوفست يدوياً 💥
                      success = Patch(baseShadow + 0x4b2d3d0, {0x1F, 0x20, 0x03, 0xD5}); // NOP
                  }
                  
                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (success) {
                          // 2. تحويل الزر للأخضر (✅)
                          [self.bypassButton setTitle:@" Bypass ✅ " forState:UIControlStateNormal];
                          self.bypassButton.layer.borderColor = [UIColor greenColor].CGColor;
                          NSLog(@"[Falcon] 🛡️ Target 0x4b2d3d0 manually disabled!");
                      } else {
                          // إذا فشل (اللعبة ما محملة بعد)، نرجع اللون الأحمر ونسمح بالمحاولة مرة ثانية
                          [self.bypassButton setTitle:@" Bypass ❌ " forState:UIControlStateNormal];
                          self.bypassButton.layer.borderColor = [UIColor redColor].CGColor;
                          self.bypassButton.userInteractionEnabled = YES; 
                      }
                  });
              });
          }
          @end

          // ==========================================
          // 🔒 شاشة القفل وتجميد اللعبة
          // ==========================================
          @interface FalconUI : NSObject
          + (void)showAuthScreen;
          + (void)showMaintenanceScreen:(NSString *)msg;
          + (void)hideMaintenanceScreen;
          @end

          static UIViewController *maintenanceVC = nil;

          @implementation FalconUI
          + (void)showAuthScreen {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIWindow *window = nil;
                  if (@available(iOS 13.0, *)) {
                      for (UIWindowScene* scene in [UIApplication sharedApplication].connectedScenes) {
                          if (scene.activationState == UISceneActivationStateForegroundActive) { window = scene.windows.firstObject; break; }
                      }
                  }
                  if (!window) window = [UIApplication sharedApplication].keyWindow;

                  if (window && window.rootViewController) {
                      UIViewController *authVC = [[UIViewController alloc] init];
                      authVC.view.backgroundColor = [UIColor blackColor];
                      
                      WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
                      [config.userContentController addScriptMessageHandler:(id<WKScriptMessageHandler>)self name:@"falconAuth"];
                      
                      WKWebView *webView = [[WKWebView alloc] initWithFrame:authVC.view.bounds configuration:config];
                      webView.backgroundColor = [UIColor clearColor];
                      webView.opaque = NO;
                      webView.scrollView.scrollEnabled = NO;
                      [authVC.view addSubview:webView];
                      
                      NSString *html = @"<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><script src='https://cdn.tailwindcss.com'></script><style>body { background: transparent; margin: 0; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; } .glass { background: rgba(15, 23, 42, 1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 20px; padding: 25px; width: 480px; text-align: center; }</style></head><body><div class='glass'><h1 class='text-3xl font-black text-white italic mb-4'>FALCON EYE</h1><input type='text' id='k' placeholder='أدخل المفتاح' class='w-full bg-[#020617] border border-blue-500/20 rounded-xl p-3 text-white text-center mb-4'><button onclick='activate()' id='btn' class='w-full bg-blue-600 text-white font-black py-3 rounded-xl'>دخول</button><div id='msg' class='mt-2 text-sm text-blue-400'></div></div><script>function pasteKey(){ window.webkit.messageHandlers.falconAuth.postMessage({action:'paste'}); } function setKey(val){ document.getElementById('k').value = val; } function activate(){ var c = document.getElementById('k').value.trim(); if(!c) return; document.getElementById('btn').disabled=true; document.getElementById('btn').style.opacity='0.5'; document.getElementById('msg').innerHTML='جاري المصادقة الآمنة...'; document.getElementById('msg').className='text-blue-400 block animate-pulse'; window.webkit.messageHandlers.falconAuth.postMessage({action:'auth', code: c}); } function showResult(isSuccess, message){ document.getElementById('btn').disabled=false; document.getElementById('btn').style.opacity='1'; document.getElementById('msg').innerHTML=message; document.getElementById('msg').className = isSuccess ? 'text-green-400 block' : 'text-red-500 block'; }</script></body></html>";
                      [webView loadHTMLString:html baseURL:nil];
                      
                      authVC.modalPresentationStyle = UIModalPresentationOverFullScreen;
                      [window.rootViewController presentViewController:authVC animated:NO completion:nil];
                  }
              });
          }

          + (void)userContentController:(WKUserContentController *)userContentController didReceiveScriptMessage:(WKScriptMessage *)message {
              NSDictionary *data = (NSDictionary *)message.body;
              if ([data[@"action"] isEqualToString:@"paste"]) {
                  NSString *p = [UIPasteboard generalPasteboard].string;
                  if (p) {
                      p = [p stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
                      [self.webView evaluateJavaScript:[NSString stringWithFormat:@"setKey('%@')", p] completionHandler:nil];
                  }
              } else if ([data[@"action"] isEqualToString:@"auth"]) {
                  NSString *c = [data[@"code"] stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
                  NSString *u = [[UIDevice currentDevice] identifierForVendor].UUIDString;
                  
                  NSString *rawUrl = [NSString stringWithFormat:@"%@?action=auth&code=%@&udid=%@", apiUrlBase, c, u];
                  NSString *encodedUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
                  
                  [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encodedUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                      dispatch_async(dispatch_get_main_queue(), ^{
                          if (e || !d) { 
                              NSString *errorMsg = e ? e.localizedDescription : @"بدون استجابة من السيرفر";
                              errorMsg = [errorMsg stringByReplacingOccurrencesOfString:@"'" withString:@"\\'"];
                              [self.webView evaluateJavaScript:[NSString stringWithFormat:@"showResult(false, '❌ خطأ بالاتصال: %@')", errorMsg] completionHandler:nil];
                              return; 
                          }
                          
                          NSDictionary *json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                          if ([json[@"status"] isEqualToString:@"success"]) {
                              SaveLicenseKey(c);
                              [self.webView evaluateJavaScript:@"showResult(true, '✅ تم التفعيل، جاري إطلاق اللعبة...')" completionHandler:nil];
                              
                              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                                  [self dismissViewControllerAnimated:YES completion:^{
                                      FetchDataFromServer();
                                  }];
                              });
                          } else {
                              NSString *errMsg = json[@"message"] ?: @"❌ الكود غير صحيح أو مرتبط بجهاز آخر";
                              errMsg = [errMsg stringByReplacingOccurrencesOfString:@"'" withString:@"\\'"];
                              [self.webView evaluateJavaScript:[NSString stringWithFormat:@"showResult(false, '%@')", errMsg] completionHandler:nil];
                          }
                      });
                  }] resume];
              }
          }
          @end

          @implementation FalconUI
          + (void)showMaintenanceScreen:(NSString *)msg {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (maintenanceVC) return;
                  
                  UIWindow *window = nil;
                  if (@available(iOS 13.0, *)) {
                      for (UIWindowScene* scene in [UIApplication sharedApplication].connectedScenes) {
                          if (scene.activationState == UISceneActivationStateForegroundActive) { window = scene.windows.firstObject; break; }
                      }
                  }
                  if (!window) window = [UIApplication sharedApplication].keyWindow;

                  if (window && window.rootViewController) {
                      maintenanceVC = [[UIViewController alloc] init];
                      maintenanceVC.view.backgroundColor = [UIColor colorWithWhite:0 alpha:0.95];
                      
                      UILabel *lbl = [[UILabel alloc] initWithFrame:CGRectMake(0, 0, window.bounds.size.width, 100)];
                      lbl.center = maintenanceVC.view.center;
                      lbl.textAlignment = NSTextAlignmentCenter;
                      lbl.font = [UIFont boldSystemFontOfSize:22];
                      lbl.textColor = [UIColor redColor];
                      lbl.numberOfLines = 0;
                      lbl.text = [NSString stringWithFormat:@"⚠️ النظام مجمد:\n%@", msg];
                      
                      [maintenanceVC.view addSubview:lbl];
                      maintenanceVC.modalPresentationStyle = UIModalPresentationOverFullScreen;
                      [window.rootViewController presentViewController:maintenanceVC animated:NO completion:nil];
                  }
              });
          }

          + (void)hideMaintenanceScreen {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (maintenanceVC) {
                      [maintenanceVC dismissViewControllerAnimated:NO completion:nil];
                      maintenanceVC = nil;
                  }
              });
          }
          @end

          /* ==========================================
             🛰️ نبض القلب (Heartbeat) - يراقب اللوحة باستمرار
             ========================================== */
          void StartHeartbeat() {
              static dispatch_source_t timer = nil;
              if (!timer) {
                  timer = dispatch_source_create(DISPATCH_SOURCE_TYPE_TIMER, 0, 0, dispatch_get_main_queue());
                  dispatch_source_set_timer(timer, dispatch_time(DISPATCH_TIME_NOW, 5.0 * NSEC_PER_SEC), 10.0 * NSEC_PER_SEC, 1.0 * NSEC_PER_SEC);
                  dispatch_source_set_event_handler(timer, ^{
                      NSString *code = GetSavedLicenseKey();
                      NSString *udid = [[UIDevice currentDevice] identifierForVendor].UUIDString;
                      NSString *url = [NSString stringWithFormat:@"%@?action=check_status&code=%@&udid=%@", apiUrlBase, code, udid];
                      
                      [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:url] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                          if (d && !e) {
                              NSDictionary *json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                              
                              if ([json[@"maintenance"] isEqualToString:@"ON"]) {
                                  [FalconUI showMaintenanceScreen:json[@"message"]];
                              } else {
                                  [FalconUI hideMaintenanceScreen];
                              }
                              
                              if ([json[@"security"] isEqualToString:@"RED"]) {
                                  [[FalconHUD sharedInstance] updateStatus:@"🔴 DANGER: Security Level RED" color:[UIColor redColor]];
                              } else {
                                  [[FalconHUD sharedInstance] updateStatus:@"🟢 System Connected | 🛡️ Secure" color:[UIColor greenColor]];
                              }
                          }
                      }] resume];
                  });
                  dispatch_resume(timer);
              }
          }

          /* ==========================================
             🚀 الحقن المستقر COW (Copy-On-Write) للأجهزة بدون جلبريك
             ========================================== */
          uintptr_t GetBase(const char* name) {
              uint32_t count = _dyld_image_count();
              for (uint32_t i = 0; i < count; i++) {
                  if (strstr(_dyld_get_image_name(i), name)) return _dyld_get_image_vmaddr_slide(i) + 0x100000000;
              }
              return 0;
          }

          bool Patch(uintptr_t addr, std::vector<uint8_t> data) {
              if (addr == 0 || data.empty()) return false;
              
              mach_port_t task = mach_task_self();
              vm_size_t size = data.size();
              
              vm_address_t page_start = addr & ~PAGE_MASK;
              vm_size_t page_size = PAGE_SIZE;

              kern_return_t kr = vm_protect(task, page_start, page_size, FALSE, VM_PROT_READ | VM_PROT_WRITE | VM_PROT_COPY);
              if (kr != KERN_SUCCESS) return false;

              kr = vm_write(task, addr, (vm_offset_t)data.data(), (mach_msg_type_number_t)size);
              vm_protect(task, page_start, page_size, FALSE, VM_PROT_READ | VM_PROT_EXECUTE);
              sys_icache_invalidate((void*)addr, size);
              
              return kr == KERN_SUCCESS;
          }

          /* ==========================================
             🚀 CRYZER HOOKS - التزييف
             ========================================== */
          void DisableAntiCheatForCryzer(ASTExtraBaseCharacter* c) {
              if(!c) return;
              c->bRecordKillData = false; c->IsEnableReportRoute = false; c->IsEnableLogAIPlayerPos = false;
              c->IsEnableReportPlayerKillFlow = false; c->IsEnableReportGameSetting = false;
              c->EnableReportGameSettingLevel = 0; c->IsEnableReportMrpcsInCircleFlow = false;
              c->IsEnableReportMrpcsInPartCircleFlow = false; c->IsEnableReportMrpcsFlow = false;
              c->bDetectingPaintDecalTarget = false; c->EnableReverseVerityBlock = false;
          }

          void ProcessCryzerHooks() {
              NSLog(@"[Falcon] 🛡️ Cryzer AntiBan: Spoofing Active.");
          }

          /* ==========================================
             🛰️ نظام الحقن الذكي
             ========================================== */
          void SafeInjectLoop(NSArray *offsetsList) {
              static int attempts = 0;
              if (attempts > 50) return; 
              
              uintptr_t baseShadow = GetBase("ShadowTrackerExtra");
              if (baseShadow == 0) {
                  attempts++;
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                      SafeInjectLoop(offsetsList);
                  });
                  return;
              }

              for (NSDictionary *item in offsetsList) {
                  uintptr_t base = GetBase([item[@"target_module"] UTF8String]);
                  if (base > 0) {
                      uintptr_t off = strtoull([item[@"offset_hex"] UTF8String], NULL, 16);
                      if (Patch(base + off, {0xC0, 0x03, 0x5F, 0xD6})) {
                          NSString *url = [NSString stringWithFormat:@"%@?action=mark_injected&hex=%@&code=%@&udid=%@", apiUrlBase, item[@"offset_hex"], GetSavedLicenseKey(), [[UIDevice currentDevice] identifierForVendor].UUIDString];
                          [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:url]] resume];
                      }
                  }
              }
              ProcessCryzerHooks();
          }

          void FetchDataFromServer() {
              StartHeartbeat();

              NSString *code = GetSavedLicenseKey();
              NSString *udid = [[UIDevice currentDevice] identifierForVendor].UUIDString;
              NSString *url = [NSString stringWithFormat:@"%@?action=get_offsets&code=%@&udid=%@", apiUrlBase, code, udid];
              
              [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:url] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                  if (d) {
                      NSDictionary *oj = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                      if (oj[@"payload"]) {
                          NSData *decoded = [[NSData alloc] initWithBase64EncodedString:oj[@"payload"] options:0];
                          NSArray *list = [NSJSONSerialization JSONObjectWithData:decoded options:0 error:nil];
                          
                          [[FalconHUD sharedInstance] showHUD];
                          [[FalconHUD sharedInstance] updateStatus:@"🟡 جاري انتظار ملفات اللعبة للحقن..." color:[UIColor yellowColor]];

                          if (list) SafeInjectLoop(list);
                      }
                  }
              }] resume];
          }

          void AutoLoginCheck() {
              NSString *k = GetSavedLicenseKey();
              if (k && k.length > 0) {
                  NSString *u = [[UIDevice currentDevice] identifierForVendor].UUIDString;
                  NSString *rawUrl = [NSString stringWithFormat:@"%@?action=auth&code=%@&udid=%@", apiUrlBase, k, u];
                  NSString *encodedUrl = [rawUrl stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
                  
                  [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:encodedUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                      if (d && !e) {
                          NSDictionary *j = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                          if ([j[@"status"] isEqualToString:@"success"]) { 
                              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 5.0 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                                  FetchDataFromServer(); 
                              });
                              return; 
                          }
                      }
                      [FalconUI showAuthScreen];
                  }] resume];
              } else {
                  [FalconUI showAuthScreen];
              }
          }

          __attribute__((constructor)) static void init() {
              dispatch_async(dispatch_get_main_queue(), ^{
                  AutoLoginCheck();
              });
          }
          EOF

      - name: Build Framework Payload
        run: |
          clang++ -dynamiclib -arch arm64 -x objective-c++ -std=c++17 -fobjc-arc \
          -undefined dynamic_lookup \
          -miphoneos-version-min=12.0 -lobjc \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -framework Foundation -framework UIKit -framework WebKit \
          -framework QuartzCore -framework CoreGraphics \
          FalconEye.mm -o FalconEye.dylib
          
          if [ -f FalconEye.dylib ]; then strip -x FalconEye.dylib; else exit 1; fi

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-Ultimate-Engine
          path: FalconEye.dylib
          if-no-files-found: error
